<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - My Crypto Faucet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.25), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.22), transparent 35%),
                linear-gradient(135deg, #07111f, #0d1b2f 45%, #111827);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            background: rgba(37, 99, 235, 0.15);
            filter: blur(70px);
            border-radius: 50%;
            top: 10%;
            left: -100px;
            animation: floatGlow 7s ease-in-out infinite;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(168, 85, 247, 0.13);
            filter: blur(80px);
            border-radius: 50%;
            bottom: -100px;
            right: -80px;
            animation: floatGlow 8s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes floatGlow {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -25px);
            }
        }

        header {
            padding: 28px 20px 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-coin {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            color: #111827;
            font-size: 25px;
            font-weight: bold;

            box-shadow:
                0 0 0 4px rgba(251, 191, 36, 0.12),
                0 0 25px rgba(251, 191, 36, 0.35);

            animation: coinPulse 2.5s ease-in-out infinite;
        }

        @keyframes coinPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        header h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: 0.3px;
        }

        .brand-subtitle {
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .page {
            min-height: calc(100vh - 115px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 18px 50px;
            position: relative;
            z-index: 2;
        }

        .container {
            width: 100%;
            max-width: 430px;

            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;

            padding: 34px 30px 30px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            animation: cardAppear 0.65s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .reset-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            background: linear-gradient(
                145deg,
                rgba(37, 99, 235, 0.25),
                rgba(124, 58, 237, 0.25)
            );

            border: 1px solid rgba(96, 165, 250, 0.25);

            box-shadow:
                0 10px 30px rgba(37, 99, 235, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .container h2 {
            text-align: center;
            margin: 0;
            font-size: 25px;
        }

        .welcome {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin: 9px 0 27px;
        }

        .field {
            text-align: left;
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            opacity: 0.75;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 15px 0 45px;

            border: 1px solid rgba(148, 163, 184, 0.20);
            border-radius: 12px;

            background: rgba(2, 6, 23, 0.55);
            color: white;

            font-size: 15px;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;

            background: rgba(2, 6, 23, 0.75);

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12),
                0 0 20px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            height: 53px;

            margin-top: 8px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.8px;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);

            box-shadow:
                0 14px 32px rgba(37, 99, 235, 0.35);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            min-height: 22px;
            margin-top: 17px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 13px;
        }

        .back-login a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .security-note {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;

            margin-top: 19px;

            color: #64748b;
            font-size: 12px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
        }

        .bottom-text span {
            color: #fbbf24;
        }

        @media (max-width: 520px) {

            header {
                padding: 22px 15px 12px;
            }

            header h1 {
                font-size: 22px;
            }

            .logo-coin {
                width: 42px;
                height: 42px;
                font-size: 21px;
            }

            .page {
                min-height: calc(100vh - 95px);
                padding: 18px 14px 35px;
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
                padding: 29px 21px 25px;
                border-radius: 21px;
            }

            .reset-icon {
                width: 62px;
                height: 62px;
                font-size: 28px;
            }

            .container h2 {
                font-size: 23px;
            }

            input,
            button {
                height: 51px;
            }
        }

        @media (max-height: 700px) {

            .page {
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">

        <div class="logo-coin">
            ₿
        </div>

        <div>
            <h1>My Crypto Faucet</h1>
        </div>

    </div>

    <p class="brand-subtitle">
        Earn Bitcoin • Claim Hourly • Withdraw
    </p>

</header>


<main class="page">

    <div class="container">

        <div class="reset-icon">
            🔐
        </div>

        <h2>Forgot Password?</h2>

        <p class="welcome">
            Enter your email address and we'll send you a verification code to reset your password.
        </p>


        <form id="forgotPasswordForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉️
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                id="sendCodeButton"
            >
                SEND VERIFICATION CODE
            </button>

        </form>


        <div id="message"></div>


        <div class="security-note">
            🛡️ Secure password recovery
        </div>


        <div class="back-login">
            Remember your password?
            <a href="/login.html">
                Back to Login
            </a>
        </div>


        <div class="bottom-text">
            Keep your <span>₿ Bitcoin</span> account secure
        </div>

    </div>

</main>


<script>
const form = document.getElementById("forgotForm");
const emailInput = document.getElementById("email");
const message = document.getElementById("message");
const button = form.querySelector("button");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {
        message.textContent = "Please enter your email address.";
        message.style.color = "#ff6b6b";
        return;
    }

    button.disabled = true;
    button.textContent = "SENDING...";
    message.textContent = "⏳ Sending verification code...";
    message.style.color = "#aaa";

    try {

        const response = await fetch(
            "/api/forgot-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email
                })
            }
        );

        const data = await response.json();

        if (response.ok && data.success) {

            message.textContent =
                "✅ If this email is registered, a verification code has been sent.";

            message.style.color = "#4ade80";

            /*
             * Next step:
             * verification-code page
             */

            setTimeout(() => {

                window.location.href =
                    "/verify-code.html?email=" +
                    encodeURIComponent(email);

            }, 1500);

        } else {

            message.textContent =
                data.error ||
                "Unable to process your request.";

            message.style.color = "#ff6b6b";

            button.disabled = false;
            button.textContent =
                "SEND VERIFICATION CODE";
        }

    } catch (error) {

        console.error(
            "Forgot password request error:",
            error
        );

        message.textContent =
            "❌ Something went wrong. Please try again.";

        message.style.color = "#ff6b6b";

        button.disabled = false;
        button.textContent =
            "SEND VERIFICATION CODE";
    }

});
</script>

    
</body>
</html>
