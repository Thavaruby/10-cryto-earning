<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - My Crypto Faucet</title>
<meta name="description" content="Login to My Crypto Faucet and claim your crypto rewards every hour.">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 15% 15%, rgba(245,197,66,.10), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(30,100,200,.13), transparent 32%),
        linear-gradient(135deg, #040b16, #071525 48%, #09182b);
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before,
body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(70px);
}

body::before {
    width: 280px;
    height: 280px;
    left: -120px;
    top: 18%;
    background: rgba(245,197,66,.08);
    animation: glowMove 8s ease-in-out infinite;
}

body::after {
    width: 300px;
    height: 300px;
    right: -130px;
    bottom: 5%;
    background: rgba(30,100,220,.10);
    animation: glowMove 9s ease-in-out infinite reverse;
}

@keyframes glowMove {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(25px,-25px);
    }
}

/* =========================
   HEADER
========================= */

header {
    position: relative;
    z-index: 2;
    padding: 28px 20px 10px;
    text-align: center;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
    color: #fff;
}

.logo-coin {
    width: 46px;
    height: 46px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(145deg,#ffe27a,#dfa812);
    color: #111;
    font-size: 25px;
    font-weight: 900;

    box-shadow:
        0 0 0 4px rgba(245,197,66,.08),
        0 0 28px rgba(245,197,66,.28);

    animation: coinPulse 3s ease-in-out infinite;
}

@keyframes coinPulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

.brand-name {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .2px;
}

.brand-name span {
    color: #f5c542;
}

.brand-subtitle {
    margin: 9px 0 0;
    color: #71859d;
    font-size: 12px;
}

/* =========================
   MAIN
========================= */

.page {
    position: relative;
    z-index: 2;

    min-height: calc(100vh - 105px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 18px 50px;
}

.container {
    width: 100%;
    max-width: 430px;

    padding: 35px 31px 29px;

    background: rgba(7,20,36,.86);

    border: 1px solid rgba(245,197,66,.12);
    border-radius: 23px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    animation: cardAppear .65s ease-out;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(22px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================
   LOGIN ICON
========================= */

.login-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 19px;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 31px;

    background:
        linear-gradient(
            145deg,
            rgba(245,197,66,.14),
            rgba(30,100,200,.10)
        );

    border: 1px solid rgba(245,197,66,.20);

    box-shadow:
        0 12px 30px rgba(245,197,66,.08),
        inset 0 1px 0 rgba(255,255,255,.06);
}

.container h2 {
    margin: 0;
    text-align: center;

    font-size: 27px;
    letter-spacing: .2px;
}

.welcome {
    margin: 9px 0 28px;

    text-align: center;

    color: #8295aa;
    font-size: 14px;
    line-height: 1.5;
}

/* =========================
   FORM
========================= */

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;

    margin-bottom: 8px;

    color: #c5d0dc;
    font-size: 13px;
    font-weight: 700;
}

.input-wrapper {
    position: relative;
}

.input-icon {
    position: absolute;
    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 16px;
    opacity: .65;

    pointer-events: none;
}

input {
    width: 100%;
    height: 52px;

    padding: 0 15px 0 44px;

    border-radius: 11px;
    border: 1px solid rgba(148,163,184,.17);

    outline: none;

    background: rgba(2,8,18,.65);
    color: #fff;

    font-size: 15px;

    transition:
        border-color .2s,
        box-shadow .2s,
        background .2s;
}

input::placeholder {
    color: #596d82;
}

input:hover {
    border-color: rgba(245,197,66,.20);
}

input:focus {
    border-color: rgba(245,197,66,.60);

    background: rgba(2,8,18,.82);

    box-shadow:
        0 0 0 3px rgba(245,197,66,.08),
        0 0 22px rgba(245,197,66,.07);
}

/* =========================
   FORGOT PASSWORD
========================= */

.forgot-password {
    text-align: right;

    margin-top: -4px;
    margin-bottom: 13px;
}

.forgot-password a {
    color: #6fa8ff;
    text-decoration: none;

    font-size: 13px;
    font-weight: 700;

    transition: .2s;
}

.forgot-password a:hover {
    color: #f5c542;
    text-decoration: underline;
}

/* =========================
   LOGIN BUTTON
========================= */

#loginButton {
    width: 100%;
    height: 53px;

    margin-top: 4px;

    border: 0;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #ffe078,
            #e0a813
        );

    color: #111;

    font-size: 14px;
    font-weight: 900;
    letter-spacing: .8px;

    cursor: pointer;

    box-shadow:
        0 10px 28px rgba(245,197,66,.18);

    transition:
        transform .18s,
        box-shadow .18s,
        opacity .18s;
}

#loginButton:hover:not(:disabled) {
    transform: translateY(-2px);

    box-shadow:
        0 15px 35px rgba(245,197,66,.27);
}

#loginButton:active:not(:disabled) {
    transform: translateY(0);
}

#loginButton:disabled {
    opacity: .62;
    cursor: not-allowed;
}

/* =========================
   MESSAGE
========================= */

#message {
    min-height: 22px;

    margin-top: 16px;

    text-align: center;

    font-size: 13px;
    font-weight: 700;

    color: #f1c94a;
}

/* =========================
   SECURITY
========================= */

.security-note {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;

    margin-top: 17px;

    color: #63778d;
    font-size: 11px;
}

.security-line {
    width: 100%;
    height: 1px;

    margin: 23px 0 18px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.07),
            transparent
        );
}

/* =========================
   REGISTER LINK
========================= */

.register-text {
    text-align: center;

    color: #7d90a5;
    font-size: 13px;
}

.register-text a {
    color: #f5c542;
    font-weight: 800;
    text-decoration: none;
}

.register-text a:hover {
    text-decoration: underline;
}

.bottom-text {
    margin-top: 18px;

    text-align: center;

    color: #52667c;
    font-size: 11px;
}

.bottom-text span {
    color: #dcae24;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    header {
        padding: 21px 15px 7px;
    }

    .logo-coin {
        width: 40px;
        height: 40px;
        font-size: 21px;
    }

    .brand-name {
        font-size: 20px;
    }

    .brand-subtitle {
        font-size: 11px;
    }

    .page {
        min-height: calc(100vh - 90px);
        align-items: flex-start;
        padding: 18px 13px 35px;
    }

    .container {
        margin-top: 8px;
        padding: 29px 21px 25px;
        border-radius: 20px;
    }

    .login-icon {
        width: 62px;
        height: 62px;
        font-size: 27px;
        border-radius: 18px;
    }

    .container h2 {
        font-size: 23px;
    }

    .welcome {
        font-size: 13px;
        margin-bottom: 24px;
    }

    input,
    #loginButton {
        height: 51px;
    }
}

@media (max-height: 700px) {

    .page {
        align-items: flex-start;
    }

    .container {
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<header>

    <a href="/" class="brand">

        <div class="logo-coin">₿</div>

        <div class="brand-name">
            My Crypto <span>Faucet</span>
        </div>

    </a>

    <p class="brand-subtitle">
        Earn Bitcoin • Claim Hourly • Withdraw
    </p>

</header>


<main class="page">

    <div class="container">

        <div class="login-icon">
            🔐
        </div>

        <h2>Welcome Back</h2>

        <p class="welcome">
            Login to continue earning your crypto rewards
        </p>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">✉️</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">🔑</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <div class="forgot-password">
                <a href="/forgot-password.html">
                    Forgot Password?
                </a>
            </div>


            <button
                type="submit"
                id="loginButton"
            >
                LOGIN TO FAUCET
            </button>

        </form>


        <div id="message"></div>


        <div class="security-note">
            🛡️ Secure login • Protected session
        </div>


        <div class="security-line"></div>


        <div class="register-text">
            Don't have an account?
            <a href="/register.html">Create one</a>
        </div>


        <div class="bottom-text">
            Start earning <span>₿ Bitcoin</span> every hour
        </div>

    </div>

</main>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("loginButton");


        button.disabled = true;

        message.innerText =
            "⏳ Logging in...";


        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


            const result =
                await response.json();


            if (result.success) {

                message.innerText =
                    "✅ Login successful!";

                window.location.href =
                    "/dashboard.html";

            } else {

                message.innerText =
                    "❌ " + (result.error || "Login failed.");

                button.disabled = false;
            }


        } catch {

            message.innerText =
                "❌ Connection error. Please try again.";

            button.disabled = false;
        }

    });

</script>

</body>
</html>
