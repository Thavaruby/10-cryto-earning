<script type="module">

/* =========================================================
   LIBRARIES
========================================================= */

import * as pdfjsLib from
"https://esm.sh/pdfjs-dist@5.4.149";

import {
    PDFDocument,
    StandardFonts,
    rgb
} from
"https://esm.sh/pdf-lib@1.17.1";

import {
    Document,
    Packer,
    Paragraph,
    TextRun,
    ImageRun,
    Table,
    TableRow,
    TableCell,
    WidthType,
    PageBreak
} from
"https://esm.sh/docx@9.9.0";

import {
    createWorker
} from
"https://esm.sh/tesseract.js@6.0.1";


/* =========================================================
   PDF.JS WORKER
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://esm.sh/pdfjs-dist@5.4.149/build/pdf.worker.mjs?bundle";


/* =========================================================
   DOM
========================================================= */

const fileInput =
document.getElementById("fileInput");

const dropZone =
document.getElementById("dropZone");

const fileInfo =
document.getElementById("fileInfo");

const outputFormat =
document.getElementById("outputFormat");

const convertBtn =
document.getElementById("convertBtn");

const statusBox =
document.getElementById("status");

let selectedFile = null;


/* =========================================================
   HELPERS
========================================================= */

function ext(name){

    const i=name.lastIndexOf(".");

    return i<0 ? "" :
        name.slice(i+1).toLowerCase();
}


function baseName(name){

    const i=name.lastIndexOf(".");

    return i<0 ? name :
        name.slice(0,i);
}


function bytesText(bytes){

    if(bytes<1024)
        return bytes+" B";

    if(bytes<1024*1024)
        return (bytes/1024).toFixed(1)+" KB";

    return (bytes/1024/1024).toFixed(2)+" MB";
}


function status(message,type="info"){

    statusBox.className="status "+type;

    statusBox.textContent=message;
}


function download(blob,name){

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;
    a.download=name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1500
    );
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function setFile(file){

    selectedFile=file;

    fileInfo.style.display="block";

    fileInfo.innerHTML=
        "<strong>"+
        escapeHTML(file.name)+
        "</strong><br>"+
        bytesText(file.size)+
        "<br>Type: "+
        escapeHTML(file.type || "unknown");

    outputFormat.value="";

    convertBtn.disabled=false;

    statusBox.className="status";
    statusBox.textContent="";
}


/* =========================================================
   FILE INPUT
========================================================= */

fileInput.addEventListener(
"change",
()=>{
    if(fileInput.files.length)
        setFile(fileInput.files[0]);
});


dropZone.addEventListener(
"click",
()=>{
    fileInput.click();
});


for(const event of ["dragenter","dragover"]){

    dropZone.addEventListener(
    event,
    e=>{
        e.preventDefault();
        dropZone.classList.add("dragover");
    });
}


for(const event of ["dragleave","drop"]){

    dropZone.addEventListener(
    event,
    e=>{
        e.preventDefault();
        dropZone.classList.remove("dragover");
    });
}


dropZone.addEventListener(
"drop",
e=>{
    const files=e.dataTransfer.files;

    if(files.length)
        setFile(files[0]);
});


/* =========================================================
   IMAGE LOADER
========================================================= */

function loadImage(blob){

    return new Promise(
    (resolve,reject)=>{

        const url=
            URL.createObjectURL(blob);

        const img=
            new Image();

        img.onload=()=>{
            URL.revokeObjectURL(url);
            resolve(img);
        };

        img.onerror=()=>{
            URL.revokeObjectURL(url);
            reject(
                new Error("Unable to read image.")
            );
        };

        img.src=url;
    });
}


/* =========================================================
   IMAGE → IMAGE
========================================================= */

async function imageToImage(file,target){

    const img=
        await loadImage(file);

    const canvas=
        document.createElement("canvas");

    canvas.width=img.naturalWidth;
    canvas.height=img.naturalHeight;

    const ctx=
        canvas.getContext("2d");

    if(target==="jpg"){

        ctx.fillStyle="#fff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    ctx.drawImage(img,0,0);

    const mime=
        target==="jpg"
        ? "image/jpeg"
        : target==="webp"
        ? "image/webp"
        : "image/png";

    const blob=
        await new Promise(
        resolve=>{
            canvas.toBlob(
                resolve,
                mime,
                .92
            );
        });

    if(!blob)
        throw new Error(
            "This browser cannot create "+
            target.toUpperCase()+" images."
        );

    return blob;
}


/* =========================================================
   IMAGE → PDF
========================================================= */

async function imageToPDF(file){

    const pdf=
        await PDFDocument.create();

    const img=
        await loadImage(file);

    const canvas=
        document.createElement("canvas");

    canvas.width=img.naturalWidth;
    canvas.height=img.naturalHeight;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="#fff";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(img,0,0);

    const png=
        await new Promise(
        resolve=>{
            canvas.toBlob(
                resolve,
                "image/png"
            );
        });

    const image=
        await pdf.embedPng(
            new Uint8Array(
                await png.arrayBuffer()
            )
        );

    const page=
        pdf.addPage([
            image.width,
            image.height
        ]);

    page.drawImage(
        image,
        {
            x:0,
            y:0,
            width:image.width,
            height:image.height
        }
    );

    return pdf.save();
}


/* =========================================================
   LOAD PDF
========================================================= */

async function loadPDF(file){

    const buffer=
        await file.arrayBuffer();

    return pdfjsLib.getDocument({
        data:new Uint8Array(buffer)
    }).promise;
}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPage(
    page,
    scale=2
){

    const viewport=
        page.getViewport({
            scale
        });

    const canvas=
        document.createElement("canvas");

    canvas.width=
        Math.ceil(viewport.width);

    canvas.height=
        Math.ceil(viewport.height);

    const ctx=
        canvas.getContext(
            "2d",
            {alpha:false}
        );

    ctx.fillStyle="#fff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    await page.render({
        canvasContext:ctx,
        viewport,
        intent:"print"
    }).promise;

    return {
        canvas,
        viewport
    };
}


/* =========================================================
   NATIVE PDF TEXT
========================================================= */

async function nativePDFText(
    page
){

    const content=
        await page.getTextContent();

    const items=
        content.items
        .filter(x=>x.str);

    let lines=[];

    let current=[];
    let currentY=null;

    for(const item of items){

        const y=
            Math.round(
                item.transform[5]
            );

        if(
            currentY!==null &&
            Math.abs(y-currentY)>5
        ){

            if(current.length)
                lines.push(
                    current.join(" ")
                );

            current=[];
        }

        current.push(item.str);

        currentY=y;
    }

    if(current.length)
        lines.push(
            current.join(" ")
        );

    return lines.join("\n");
}


/* =========================================================
   OCR
========================================================= */

async function OCRImage(
    canvas,
    worker
){

    const result=
        await worker.recognize(canvas);

    return result.data.text || "";
}


/* =========================================================
   PDF → TEXT
   Native + OCR fallback
========================================================= */

async function pdfToText(
    file,
    useOCR=true
){

    const pdf=
        await loadPDF(file);

    let all=[];

    let worker=null;

    try{

        for(
            let n=1;
            n<=pdf.numPages;
            n++
        ){

            status(
                "Reading PDF page "+
                n+
                " of "+
                pdf.numPages+
                "...",
                "info"
            );

            const page=
                await pdf.getPage(n);

            let text=
                await nativePDFText(page);

            /*
             * Native PDF text is normally much better
             * than OCR, so use it first.
             */

            if(
                !text.trim() &&
                useOCR
            ){

                if(!worker){

                    status(
                        "Scanned PDF detected. Starting OCR...",
                        "info"
                    );

                    worker=
                        await createWorker(
                            "eng"
                        );
                }

                const rendered=
                    await renderPage(
                        page,
                        2
                    );

                text=
                    await OCRImage(
                        rendered.canvas,
                        worker
                    );
            }

            all.push(text.trim());

        }

    }finally{

        if(worker)
            await worker.terminate();

    }

    return all.join(
        "\n\n---------------- PAGE BREAK ----------------\n\n"
    );
}


/* =========================================================
   PDF → TXT
========================================================= */

async function PDFToTXT(file){

    const text=
        await pdfToText(
            file,
            true
        );

    return new Blob(
        [text],
        {
            type:"text/plain;charset=utf-8"
        }
    );
}


/* =========================================================
   PDF → DOCX
 *
 * Important design:
 *
 * Each PDF page is preserved visually as an image.
 *
 * Editable extracted/OCR text is then added to the
 * Word document as real Word text.
 *
 * This gives a useful document for:
 * - scanned PDFs
 * - forms
 * - image PDFs
 * - normal text PDFs
 *
 * The page appearance is preserved while the text
 * remains editable.
========================================================= */

async function PDFToDOCX(file){

    const pdf=
        await loadPDF(file);

    const children=[];

    let worker=null;

    try{

        for(
            let n=1;
            n<=pdf.numPages;
            n++
        ){

            status(
                "Preparing Word page "+
                n+
                " of "+
                pdf.numPages+
                "...",
                "info"
            );

            const page=
                await pdf.getPage(n);

            const rendered=
                await renderPage(
                    page,
                    1.6
                );

            const png=
                await new Promise(
                resolve=>{
                    rendered.canvas.toBlob(
                        resolve,
                        "image/png"
                    );
                });

            const pngBytes=
                new Uint8Array(
                    await png.arrayBuffer()
                );

            /*
             * Native text first.
             */

            let text=
                await nativePDFText(page);

            /*
             * OCR fallback for scanned/image PDFs.
             */

            if(!text.trim()){

                if(!worker){

                    status(
                        "Scanned PDF detected. Starting OCR...",
                        "info"
                    );

                    worker=
                        await createWorker(
                            "eng"
                        );
                }

                text=
                    await OCRImage(
                        rendered.canvas,
                        worker
                    );
            }

            /*
             * Visual PDF page.
             *
             * This is a real embedded Word image,
             * not a server-side file.
             */

            children.push(
                new Paragraph({
                    children:[
                        new ImageRun({
                            type:"png",
                            data:pngBytes,
                            transformation:{
                                width:595,
                                height:
                                    Math.round(
                                        595 *
                                        rendered.canvas.height /
                                        rendered.canvas.width
                                    )
                            }
                        })
                    ],
                    spacing:{
                        before:0,
                        after:0
                    }
                })
            );

            /*
             * Editable text.
             *
             * We deliberately place the extracted text
             * immediately after the visual page instead
             * of creating broken fake textboxes.
             *
             * This makes the DOCX stable and editable
             * in Word.
             */

            if(text.trim()){

                children.push(
                    new Paragraph({
                        children:[
                            new TextRun({
                                text:
                                    "Editable text — Page "+
                                    n,
                                bold:true,
                                size:18,
                                color:"6D28D9"
                            })
                        ],
                        spacing:{
                            before:120,
                            after:60
                        }
                    })
                );

                const lines=
                    text
                    .replace(/\r/g,"")
                    .split("\n");

                for(const line of lines){

                    if(!line.trim()){

                        children.push(
                            new Paragraph({
                                children:[
                                    new TextRun({
                                        text:" "
                                    })
                                ],
                                spacing:{
                                    before:0,
                                    after:0
                                }
                            })
                        );

                        continue;
                    }

                    children.push(
                        new Paragraph({
                            children:[
                                new TextRun({
                                    text:line,
                                    size:20
                                })
                            ],
                            spacing:{
                                before:0,
                                after:40
                            }
                        })
                    );
                }
            }

            if(n < pdf.numPages){

                children.push(
                    new Paragraph({
                        children:[
                            new PageBreak()
                        ]
                    })
                );
            }
        }

    }finally{

        if(worker)
            await worker.terminate();

    }

    const doc=
        new Document({

            creator:"My Crypto Faucet",

            title:
                baseName(file.name),

            description:
                "PDF converted to editable Word.",

            sections:[{
                properties:{
                    page:{
                        margin:{
                            top:360,
                            right:360,
                            bottom:360,
                            left:360
                        }
                    }
                },

                children
            }]
        });

    return Packer.toBlob(doc);
}


/* =========================================================
   TEXT → PDF
========================================================= */

async function textToPDF(file){

    const text=
        await file.text();

    const pdf=
        await PDFDocument.create();

    const font=
        await pdf.embedFont(
            StandardFonts.Helvetica
        );

    const pageWidth=595;
    const pageHeight=842;

    const margin=45;
    const fontSize=11;
    const lineHeight=16;

    const rawLines=
        text.replace(/\r/g,"")
        .split("\n");

    let page=
        pdf.addPage([
            pageWidth,
            pageHeight
        ]);

    let y=
        pageHeight-margin;

    for(const raw of rawLines){

        const line=
            raw || " ";

        /*
         * Simple wrapping.
         */

        const words=
            line.split(/\s+/);

        let current="";

        for(const word of words){

            const test=
                current
                ? current+" "+word
                : word;

            const width=
                font.widthOfTextAtSize(
                    test,
                    fontSize
                );

            if(
                width >
                pageWidth-margin*2
            ){

                if(y<margin){

                    page=
                        pdf.addPage([
                            pageWidth,
                            pageHeight
                        ]);

                    y=
                        pageHeight-margin;
                }

                page.drawText(
                    current,
                    {
                        x:margin,
                        y,
                        size:fontSize,
                        font,
                        color:rgb(0,0,0)
                    }
                );

                y-=lineHeight;

                current=word;

            }else{

                current=test;
            }
        }

        if(y<margin){

            page=
                pdf.addPage([
                    pageWidth,
                    pageHeight
                ]);

            y=
                pageHeight-margin;
        }

        page.drawText(
            current,
            {
                x:margin,
                y,
                size:fontSize,
                font,
                color:rgb(0,0,0)
            }
        );

        y-=lineHeight;
    }

    return pdf.save();
}


/* =========================================================
   IMAGE → PDF
========================================================= */

async function imageFileToPDF(file){

    return imageToPDF(file);
}


/* =========================================================
   PDF → IMAGE
========================================================= */

async function PDFToImage(
    file,
    target
){

    const pdf=
        await loadPDF(file);

    /*
     * Keep one-page behavior.
     * For a PDF with many pages, user can use
     * PDF → TXT / Word instead.
     */

    const page=
        await pdf.getPage(1);

    const rendered=
        await renderPage(
            page,
            2
        );

    const canvas=
        rendered.canvas;

    let mime="image/png";
    let extension="png";
    let quality=undefined;

    if(target==="jpg"){

        mime="image/jpeg";
        extension="jpg";
        quality=.92;

        const jpg=
            document.createElement("canvas");

        jpg.width=canvas.width;
        jpg.height=canvas.height;

        const ctx=
            jpg.getContext("2d");

        ctx.fillStyle="#fff";

        ctx.fillRect(
            0,
            0,
            jpg.width,
            jpg.height
        );

        ctx.drawImage(
            canvas,
            0,
            0
        );

        return {
            blob:
                await new Promise(
                resolve=>{
                    jpg.toBlob(
                        resolve,
                        mime,
                        quality
                    );
                }),
            extension
        };
    }

    if(target==="webp"){

        mime="image/webp";
        extension="webp";
        quality=.92;
    }

    return {
        blob:
            await new Promise(
            resolve=>{
                canvas.toBlob(
                    resolve,
                    mime,
                    quality
                );
            }),

        extension
    };
}

   SIMPLE FILE → TEXT

/* =========================================================
   MAIN CONVERTER
========================================================= */

async function convert(){

    if(!selectedFile){

        status(
            "Please select a file.",
            "error"
        );

        return;
    }

    const source=
        ext(selectedFile.name);

    const target=
        outputFormat.value;

    if(!target){

        status(
            "Please select an output format.",
            "error"
        );

        return;
    }

    const base=
        baseName(selectedFile.name);

    convertBtn.disabled=true;

    try{

        /* ===============================================
           PDF → DOCX
        =============================================== */

        if(
            source==="pdf" &&
            target==="docx"
        ){

            const blob=
                await PDFToDOCX(
                    selectedFile
                );

            download(
                blob,
                base+".docx"
            );

            status(
                "PDF → Word completed successfully.",
                "success"
            );

            return;
        }


        /* ===============================================
           PDF → TXT
        =============================================== */

        if(
            source==="pdf" &&
            target==="txt"
        ){

            const blob=
                await PDFToTXT(
                    selectedFile
                );

            download(
                blob,
                base+".txt"
            );

            status(
                "PDF → TXT completed successfully.",
                "success"
            );

            return;
        }


        /* ===============================================
           PDF → IMAGE
        =============================================== */

        if(
            source==="pdf" &&
            (
                target==="jpg" ||
                target==="png" ||
                target==="webp"
            )
        ){

            const result=
                await PDFToImage(
                    selectedFile,
                    target
                );

            download(
                result.blob,
                base+"."+result.extension
            );

            status(
                "PDF page converted successfully.",
                "success"
            );

            return;
        }


        /* ===============================================
           IMAGE → IMAGE
        =============================================== */

        const images=[
            "jpg",
            "jpeg",
            "png",
            "webp",
            "avif",
            "bmp",
            "gif"
        ];

        if(
            images.includes(source) &&
            (
                target==="jpg" ||
                target==="png" ||
                target==="webp"
            )
        ){

            const blob=
                await imageToImage(
                    selectedFile,
                    target
                );

            download(
                blob,
                base+"."+target
            );

            status(
                "Image conversion completed successfully.",
                "success"
            );

            return;
        }


        /* ===============================================
           IMAGE → PDF
        =============================================== */

        if(
            images.includes(source) &&
            target==="pdf"
        ){

            const bytes=
                await imageFileToPDF(
                    selectedFile
                );

            download(
                new Blob(
                    [bytes],
                    {
                        type:"application/pdf"
                    }
                ),
                base+".pdf"
            );

            status(
                "Image → PDF completed successfully.",
                "success"
            );

            return;
        }


        /* ===============================================
           TXT / CSV / HTML / RTF → TXT
        =============================================== */

        const textTypes=[
            "txt",
            "csv",
            "html",
            "htm",
            "rtf"
        ];

        if(
            textTypes.includes(source) &&
            target==="txt"
        ){

            const blob=
                await textToTXT(
                    selectedFile
                );

            download(
                blob,
                base+".txt"
            );

            status(
                "File → TXT completed successfully.",
                "success"
            );

            return;
        }


        /* ===============================================
           TXT / CSV / HTML / RTF → PDF
        =============================================== */

        if(
            textTypes.includes(source) &&
            target==="pdf"
        ){

            const bytes=
                await textToPDF(
                    selectedFile
                );

            download(
                new Blob(
                    [bytes],
                    {
                        type:"application/pdf"
                    }
                ),
                base+".pdf"
            );

            status(
                "File → PDF completed successfully.",
                "success"
            );

            return;
        }


        /* ===============================================
           TXT → DOCX
        =============================================== */

        if(
            source==="txt" &&
            target==="docx"
        ){

            const text=
                await selectedFile.text();

            const paragraphs=
                text
                .replace(/\r/g,"")
                .split("\n")
                .map(
                line=>
                    new Paragraph({
                        children:[
                            new TextRun({
                                text:line,
                                size:22
                            })
                        ]
                    })
                );

            const doc=
                new Document({
                    sections:[{
                        children:paragraphs
                    }]
                });

            const blob=
                await Packer.toBlob(doc);

            download(
                blob,
                base+".docx"
            );

            status(
                "TXT → Word completed successfully.",
                "success"
            );

            return;
        }


        throw new Error(
            "This conversion is not available in the current browser version."
        );

    }catch(error){

        console.error(error);

        status(
            error?.message ||
            "Conversion failed.",
            "error"
        );

    }finally{

        convertBtn.disabled=false;
    }
}


/* =========================================================
   START
========================================================= */

convertBtn.addEventListener(
    "click",
    convert
);

</script>

</body>
</html>
