<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF to Word Converter</title>

<!-- PDF.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Tesseract.js for OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- docx.js for generating Word Files -->
<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07152f;
    color:#fff;
}

.wrap{
    max-width:900px;
    margin:auto;
    padding:30px 16px 60px;
}

h1{
    text-align:center;
    color:#f5c542;
    margin:10px 0 8px;
}

.sub{
    text-align:center;
    color:#b9c5d8;
    margin-bottom:28px;
}

.card{
    background:#0d2144;
    border:1px solid #27436e;
    border-radius:16px;
    padding:22px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.drop{
    border:2px dashed #f5c542;
    border-radius:14px;
    padding:45px 20px;
    text-align:center;
    cursor:pointer;
    background:#091a36;
    display:block;
}

.drop:hover{
    background:#10264b;
}

input[type=file]{
    display:none;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    margin-top:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#f5c542;
    color:#07152f;
}

.primary:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.status{
    margin-top:18px;
    padding:14px;
    border-radius:10px;
    background:#07152f;
    color:#dce5f4;
    white-space:pre-wrap;
    line-height:1.5;
}

.progress{
    width:100%;
    height:9px;
    margin-top:14px;
    background:#07152f;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:#f5c542;
    transition:width .2s;
}

.file{
    margin-top:14px;
    color:#f5c542;
    word-break:break-word;
}
</style>
</head>

<body>

<div class="wrap">
    <h1>PDF → Word</h1>
    <div class="sub">
        Convert PDF pages into an editable Word document locally in your browser.
    </div>

    <div class="card">
        <label class="drop" id="drop">
            <strong>Choose PDF</strong><br><br>
            Tap here or drag & drop your PDF
            <input id="file" type="file" accept="application/pdf,.pdf">
        </label>

        <div class="file" id="filename"></div>

        <button class="primary" id="convert" disabled>
            Convert to Word
        </button>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div class="status" id="status">Select a PDF to begin.</div>
    </div>
</div>

<script>
// Configure PDF.js Worker
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const { Document, Packer, Paragraph, TextRun } = window.docx;

const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const convertBtn = document.getElementById("convert");
const statusBox = document.getElementById("status");
const filenameBox = document.getElementById("filename");
const bar = document.getElementById("bar");

let selectedFile = null;

fileInput.addEventListener("change", (e) => {
    if (e.target.files.length) {
        handleSelectedFile(e.target.files[0]);
    }
});

drop.addEventListener("dragover", e => e.preventDefault());

drop.addEventListener("drop", e => {
    e.preventDefault();
    if (!e.dataTransfer.files.length) return;
    const file = e.dataTransfer.files[0];
    if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
        handleSelectedFile(file);
    } else {
        setStatus("Please select a valid PDF file.");
    }
});

function handleSelectedFile(file) {
    selectedFile = file;
    filenameBox.textContent = selectedFile.name;
    convertBtn.disabled = false;
    setStatus("PDF selected.\nReady to convert.");
}

function setProgress(value){
    bar.style.width = value + "%";
}

function setStatus(text){
    statusBox.textContent = text;
}

function escapeText(text){
    return String(text || "").replace(/\u0000/g,"").trim();
}

/* EXTRACT DIRECT TEXT FROM PDF PAGE */
async function extractPDFText(page){
    const content = await page.getTextContent();
    let lastY, text = '';
    
    for (let item of content.items) {
        if (lastY == null || Math.abs(item.transform[5] - lastY) < 5) {
            text += ' ' + item.str;
        } else {
            text += '\n' + item.str;
        }
        lastY = item.transform[5];
    }
    return text.trim();
}

/* RENDER PDF PAGE TO CANVAS FOR OCR */
async function renderPage(page){
    const viewport = page.getViewport({ scale: 2.0 });
    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    await page.render({ canvasContext: context, viewport }).promise;
    return canvas;
}

/* OCR PROCESS VIA TESSERACT */
async function OCRPage(canvas, pageNumber, worker){
    setStatus(`OCR processing page ${pageNumber}...`);
    const result = await worker.recognize(canvas);
    return result.data;
}

/* CREATE DOCX FILE */
async function createDocx(pagesData){
    const sections = [];

    for(const page of pagesData){
        const children = [];

        if(page.mode === "text"){
            const lines = page.text.split('\n');
            for(const line of lines){
                const cleanLine = escapeText(line);
                if(cleanLine) {
                    children.push(
                        new Paragraph({
                            children: [ new TextRun({ text: cleanLine, size: 22 }) ],
                            spacing: { after: 120 }
                        })
                    );
                }
            }
        } else if (page.mode === "ocr") {
            const lines = page.ocr.lines || [];
            if (lines.length > 0) {
                for (const line of lines) {
                    const cleanLine = escapeText(line.text);
                    if (cleanLine) {
                        children.push(
                            new Paragraph({
                                children: [ new TextRun({ text: cleanLine, size: 22 }) ],
                                spacing: { after: 100 }
                            })
                        );
                    }
                }
            } else {
                children.push(
                    new Paragraph({
                        children: [ new TextRun({ text: escapeText(page.ocr.text), size: 22 }) ]
                    })
                );
            }
        }

        sections.push({
            properties: {
                page: {
                    margin: { top: 720, bottom: 720, left: 720, right: 720 }
                }
            },
            children
        });
    }

    const doc = new Document({ sections });
    return Packer.toBlob(doc);
}

/* MAIN CONVERSION LOGIC */
convertBtn.addEventListener("click", async () => {
    if(!selectedFile) return;

    convertBtn.disabled = true;

    try {
        setProgress(5);
        setStatus("Reading PDF file...");

        const buffer = await selectedFile.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

        const pagesData = [];
        let totalCharacters = 0;

        // First Pass: Check Text Content
        for(let i = 1; i <= pdf.numPages; i++){
            const page = await pdf.getPage(i);
            const text = await extractPDFText(page);
            totalCharacters += text.length;

            pagesData.push({ page, text });
            setProgress(5 + Math.round((i / pdf.numPages) * 20));
        }

        // Process based on text availability
        if (totalCharacters > 30) {
            setStatus("Direct text detected.\nGenerating Word document...");
            for(const p of pagesData){
                p.mode = "text";
            }
        } else {
            setStatus("Scanned PDF / Image detected.\nInitializing OCR engine...");
            const worker = await Tesseract.createWorker("eng");

            for(let i = 0; i < pagesData.length; i++){
                const canvas = await renderPage(pagesData[i].page);
                const ocrResult = await OCRPage(canvas, i + 1, worker);
                
                pagesData[i].mode = "ocr";
                pagesData[i].ocr = ocrResult;

                setProgress(25 + Math.round(((i + 1) / pagesData.length) * 60));
            }

            await worker.terminate();
        }

        setStatus("Building Word document (.docx)...");
        setProgress(90);

        const blob = await createDocx(pagesData);
        setProgress(98);

        // Download
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const baseName = selectedFile.name.replace(/\.pdf$/i, "");
        a.href = url;
        a.download = `${baseName}-converted.docx`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 5000);

        setProgress(100);
        setStatus("Conversion Complete!\nYour Word document has been downloaded.");

    } catch (error) {
        console.error(error);
        setProgress(0);
        setStatus("Error converting file:\n" + (error?.message || "Unknown error occurred."));
    } finally {
        convertBtn.disabled = false;
    }
});
</script>

</body>
</html>
