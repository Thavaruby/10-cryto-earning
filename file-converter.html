<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="icon" type="image/png" href="assets/favico.png">

<title>PDF to Word — My Crypto Faucet</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07152f;
    color:#fff;
}

.wrap{
    max-width:900px;
    margin:auto;
    padding:30px 16px 60px;
}

h1{
    text-align:center;
    color:#f5c542;
    margin:10px 0 8px;
}

.sub{
    text-align:center;
    color:#b9c5d8;
    margin-bottom:28px;
}

.card{
    background:#0d2144;
    border:1px solid #27436e;
    border-radius:16px;
    padding:22px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.drop{
    border:2px dashed #f5c542;
    border-radius:14px;
    padding:45px 20px;
    text-align:center;
    cursor:pointer;
    background:#091a36;
}

.drop:hover{
    background:#10264b;
}

input[type=file]{
    display:none;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    margin-top:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#f5c542;
    color:#07152f;
}

.primary:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.status{
    margin-top:18px;
    padding:14px;
    border-radius:10px;
    background:#07152f;
    color:#dce5f4;
    white-space:pre-wrap;
    line-height:1.5;
}

.progress{
    width:100%;
    height:9px;
    margin-top:14px;
    background:#07152f;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:#f5c542;
    transition:width .2s;
}

.file{
    margin-top:14px;
    color:#f5c542;
    word-break:break-word;
}
</style>
</head>

<body>

<div class="wrap">

<h1>PDF → Word</h1>

<div class="sub">
Convert PDF pages into an editable Word document locally in your browser.
</div>

<div class="card">

<label class="drop" id="drop">
    <strong>Choose PDF</strong><br><br>
    Tap here or drag & drop your PDF
    <input id="file" type="file" accept="application/pdf,.pdf">
</label>

<div class="file" id="filename"></div>

<button class="primary" id="convert" disabled>
    Convert to Word
</button>

<div class="progress">
    <div class="bar" id="bar"></div>
</div>

<div class="status" id="status">
Select a PDF to begin.
</div>

</div>
</div>

<script type="module">

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const {
    Document,
    Packer,
    Paragraph,
    TextRun,
    ImageRun,
    AlignmentType
} = window.docx;

const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const convertBtn = document.getElementById("convert");
const statusBox = document.getElementById("status");
const filenameBox = document.getElementById("filename");
const bar = document.getElementById("bar");

let selectedFile = null;

drop.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", () => {
    if(fileInput.files.length){
        selectedFile = fileInput.files[0];

        filenameBox.textContent =
            selectedFile.name;

        convertBtn.disabled = false;

        statusBox.textContent =
            "PDF selected.\nReady to convert.";
    }
});

drop.addEventListener("dragover", e => {
    e.preventDefault();
});

drop.addEventListener("drop", e => {
    e.preventDefault();

    const files = e.dataTransfer.files;

    if(!files.length) return;

    const file = files[0];

    if(
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ){
        statusBox.textContent =
            "Please select a PDF file.";
        return;
    }

    selectedFile = file;

    filenameBox.textContent =
        selectedFile.name;

    convertBtn.disabled = false;

    statusBox.textContent =
        "PDF selected.\nReady to convert.";
});

function setProgress(value){
    bar.style.width = value + "%";
}

function setStatus(text){
    statusBox.textContent = text;
}

function escapeText(text){
    return String(text || "")
        .replace(/\u0000/g,"")
        .trim();
}

/*
=========================================================
TEXT PDF DETECTION
=========================================================
*/

async function extractPDFText(page){

    const content =
        await page.getTextContent();

    return content.items
        .map(item => item.str || "")
        .join(" ")
        .trim();
}

/*
=========================================================
RENDER PAGE FOR OCR
=========================================================
*/

async function renderPage(page){

    const viewport =
        page.getViewport({scale:2.5});

    const canvas =
        document.createElement("canvas");

    const context =
        canvas.getContext("2d");

    canvas.width =
        Math.ceil(viewport.width);

    canvas.height =
        Math.ceil(viewport.height);

    await page.render({
        canvasContext:context,
        viewport
    }).promise;

    return {
        canvas,
        width:viewport.width,
        height:viewport.height
    };
}

/*
=========================================================
OCR
=========================================================
*/

async function OCRPage(canvas, pageNumber){

    setStatus(
        "OCR processing page " +
        pageNumber +
        "..."
    );

    const worker =
        await Tesseract.createWorker("eng+fra");

    const result =
        await worker.recognize(canvas);

    await worker.terminate();

    return result.data;
}

/*
=========================================================
BUILD EDITABLE DOCX FROM OCR WORD BOXES
=========================================================
*/

function buildOCRParagraphs(data){

    const words =
        data.words || [];

    if(!words.length){

        const text =
            escapeText(data.text);

        return [
            new Paragraph({
                children:[
                    new TextRun({
                        text
                    })
                ]
            })
        ];
    }

    const lines = [];

    for(const word of words){

        const text =
            escapeText(word.text);

        if(!text) continue;

        const box =
            word.bbox || {};

        const top =
            Number(box.y0 || 0);

        let line =
            lines.find(
                l =>
                    Math.abs(l.top - top) < 24
            );

        if(!line){

            line = {
                top,
                words:[]
            };

            lines.push(line);
        }

        line.words.push({
            text,
            left:Number(box.x0 || 0)
        });
    }

    lines.sort(
        (a,b)=>a.top-b.top
    );

    return lines.map(line => {

        line.words.sort(
            (a,b)=>a.left-b.left
        );

        return new Paragraph({
            children:
                line.words.map(
                    (word,index)=>
                        new TextRun({
                            text:
                                (index ? " " : "") +
                                word.text,
                            size:20
                        })
                ),
            spacing:{
                after:80
            }
        });
    });
}

/*
=========================================================
CREATE DOCX
=========================================================
*/

async function createDocx(pages){

    const sections = [];

    for(const page of pages){

        const children = [];

        if(page.mode === "text"){

            const lines =
                page.items;

            for(const line of lines){

                children.push(
                    new Paragraph({
                        children:[
                            new TextRun({
                                text:line,
                                size:20
                            })
                        ],
                        spacing:{
                            after:100
                        }
                    })
                );
            }

        }else{

            children.push(
                ...buildOCRParagraphs(
                    page.ocr
                )
            );
        }

        sections.push({
            properties:{
                page:{
                    size:{
                        width:11906,
                        height:16838
                    },
                    margin:{
                        top:720,
                        bottom:720,
                        left:720,
                        right:720
                    }
                }
            },
            children
        });
    }

    const doc =
        new Document({
            sections
        });

    return Packer.toBlob(doc);
}

/*
=========================================================
MAIN CONVERSION
=========================================================
*/

convertBtn.addEventListener("click", async ()=>{

    if(!selectedFile) return;

    convertBtn.disabled = true;

    try{

        setProgress(5);

        setStatus(
            "Reading PDF..."
        );

        const buffer =
            await selectedFile.arrayBuffer();

        const pdf =
            await pdfjsLib.getDocument({
                data:buffer
            }).promise;

        const pages = [];

        let totalCharacters = 0;

        /*
        ---------------------------------------------
        FIRST PASS
        Detect whether PDF contains real text.
        ---------------------------------------------
        */

        for(let i=1;i<=pdf.numPages;i++){

            const page =
                await pdf.getPage(i);

            const text =
                await extractPDFText(page);

            totalCharacters +=
                text.length;

            pages.push({
                page,
                text
            });

            setProgress(
                5 +
                Math.round(
                    (i/pdf.numPages)*20
                )
            );
        }

        /*
        ---------------------------------------------
        TEXT PDF
        ---------------------------------------------
        */

        if(totalCharacters > 20){

            setStatus(
                "Real text detected.\n" +
                "Creating editable Word text..."
            );

            for(const page of pages){

                const clean =
                    escapeText(page.text);

                page.mode = "text";

                page.items =
                    clean
                    .split(/\s{2,}|\n+/)
                    .filter(Boolean);
            }

        }else{

            /*
            -----------------------------------------
            SCANNED / IMAGE PDF
            -----------------------------------------
            */

            setStatus(
                "Scanned/image PDF detected.\n" +
                "Starting OCR..."
            );

            for(
                let i=0;
                i<pages.length;
                i++
            ){

                const rendered =
                    await renderPage(
                        pages[i].page
                    );

                const ocr =
                    await OCRPage(
                        rendered.canvas,
                        i+1
                    );

                pages[i].mode =
                    "ocr";

                pages[i].ocr =
                    ocr;

                setProgress(
                    25 +
                    Math.round(
                        ((i+1)/pages.length)*55
                    )
                );
            }
        }

        setStatus(
            "Building editable Word document..."
        );

        setProgress(85);

        const blob =
            await createDocx(pages);

        setProgress(95);

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        const base =
            selectedFile.name
                .replace(/\.pdf$/i,"");

        a.href = url;

        a.download =
            base + "-editable.docx";

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(
            ()=>URL.revokeObjectURL(url),
            5000
        );

        setProgress(100);

        setStatus(
            "Conversion complete.\n\n" +
            "The Word file contains real editable text.\n" +
            "No PDF upload/server conversion was used."
        );

    }catch(error){

        console.error(error);

        setProgress(0);

        setStatus(
            "Conversion failed.\n\n" +
            (error?.message ||
             "The PDF could not be processed.")
        );

    }finally{

        convertBtn.disabled = false;
    }

});

</script>

</body>
    </html>
