<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="icon" type="image/png" href="assets/favico.png">

<title>PDF to Word — My Crypto Faucet</title>

<style>
:root{
    --bg:#071426;
    --card:#0d1d34;
    --border:#294463;
    --gold:#f5c542;
    --gold2:#ffd968;
    --text:#f5f7fb;
    --muted:#aebbd0;
    --green:#39dc7d;
    --red:#ff6875;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:24px 14px 50px;
    background:linear-gradient(180deg,#061224,#0b1b31);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

.wrapper{
    width:100%;
    max-width:820px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    width:58px;
    height:58px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:5px;
}

h1{
    margin:12px 0 6px;
    color:var(--gold);
    font-size:28px;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    box-shadow:0 18px 50px rgba(0,0,0,.3);
}

.drop{
    min-height:230px;
    border:2px dashed #355578;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    padding:25px;
}

.drop.drag{
    border-color:var(--gold);
    background:rgba(245,197,66,.05);
}

.icon{
    font-size:50px;
    margin-bottom:12px;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.help{
    color:var(--muted);
    font-size:13px;
    margin-top:8px;
}

input{
    display:none;
}

.info{
    display:none;
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    background:#102541;
    border:1px solid var(--border);
}

.name{
    font-weight:bold;
    word-break:break-word;
}

.size{
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
}

.controls{
    display:none;
    margin-top:18px;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.convert{
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#17120a;
}

.reset{
    background:#172d49;
    color:#fff;
    border:1px solid #345271;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.progress{
    display:none;
    margin-top:18px;
}

.progressTop{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:13px;
    margin-bottom:7px;
}

.track{
    height:9px;
    background:#152941;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    width:0;
    height:100%;
    background:linear-gradient(90deg,#f5c542,#ffe38b);
    transition:width .25s;
}

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.status.info{
    display:block;
    background:#102844;
    color:#bdd5f2;
}

.status.success{
    display:block;
    background:#0c3020;
    color:#83efb1;
}

.status.error{
    display:block;
    background:#35151b;
    color:#ff9da5;
}

.note{
    margin-top:18px;
    color:#8fa3be;
    text-align:center;
    font-size:11px;
    line-height:1.5;
}

footer{
    margin-top:20px;
    text-align:center;
    color:#71849d;
    font-size:11px;
}
</style>
</head>

<body>

<div class="wrapper">

<header>

<img
    src="assets/favico.png"
    class="logo"
    alt="My Crypto Faucet">

<h1>PDF → Word</h1>

<div class="subtitle">
Convert PDF into an editable Word document
</div>

</header>

<div class="card">

<div
    id="drop"
    class="drop">

<div class="icon">📄</div>

<div class="title">
Drop PDF here
</div>

<div class="help">
or tap to choose a PDF file
</div>

<input
    id="file"
    type="file"
    accept=".pdf,application/pdf">

</div>


<div
    id="info"
    class="info">

<div
    id="name"
    class="name">
</div>

<div
    id="size"
    class="size">
</div>

</div>


<div
    id="controls"
    class="controls">

<button
    id="convert"
    class="convert">

Convert to editable Word

</button>

<button
    id="reset"
    class="reset">

Choose another PDF

</button>

</div>


<div
    id="progress"
    class="progress">

<div class="progressTop">

<span id="progressText">
Preparing...
</span>

<span id="percent">
0%
</span>

</div>

<div class="track">

<div
    id="bar"
    class="bar">
</div>

</div>

</div>


<div
    id="status"
    class="status">
</div>


<div class="note">

Your PDF is processed locally in the browser.
No PDF upload to your website server is required.

</div>

</div>

<footer>
My Crypto Faucet — Free Tools
</footer>

</div>


<script type="module">

/*
=========================================================
PDF → DOCX ENGINE
=========================================================

This uses pdf2docx-wasm rather than:
    PDF page image + fake text overlay.

The package contains:
    pdf2docx
    PyMuPDF
    python-docx
    Pyodide

and is intended for client-side WASM conversion.
=========================================================
*/

import * as PDF2DOCX
from "https://cdn.jsdelivr.net/npm/pdf2docx-wasm@0.1.0/index.js";


const drop =
    document.getElementById("drop");

const fileInput =
    document.getElementById("file");

const info =
    document.getElementById("info");

const nameBox =
    document.getElementById("name");

const sizeBox =
    document.getElementById("size");

const controls =
    document.getElementById("controls");

const convertBtn =
    document.getElementById("convert");

const resetBtn =
    document.getElementById("reset");

const progress =
    document.getElementById("progress");

const progressText =
    document.getElementById("progressText");

const percent =
    document.getElementById("percent");

const bar =
    document.getElementById("bar");

const status =
    document.getElementById("status");


let selectedFile = null;


/* =====================================================
   HELPERS
===================================================== */

function setStatus(
    text,
    type="info"
){

    status.className =
        "status " + type;

    status.textContent =
        text;
}


function setProgress(
    value,
    text
){

    const p =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    progress.style.display =
        "block";

    bar.style.width =
        p + "%";

    percent.textContent =
        Math.round(p) + "%";

    progressText.textContent =
        text;
}


function bytes(
    value
){

    if(value < 1024)
        return value + " B";

    if(value < 1024*1024)
        return (
            value / 1024
        ).toFixed(1) + " KB";

    return (
        value / 1024 / 1024
    ).toFixed(2) + " MB";
}


function baseName(
    name
){

    return name
        .replace(
            /\.pdf$/i,
            ""
        )
        .replace(
            /[<>:"/\\|?*]/g,
            "_"
        )
        .trim()
        || "converted";
}


function download(
    data,
    filename
){

    const blob =
        data instanceof Blob
            ? data
            : new Blob([
                data
            ],{
                type:
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            });

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement(
            "a"
        );

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        () =>
            URL.revokeObjectURL(
                url
            ),
        5000
    );
}


/* =====================================================
   FILE SELECTION
===================================================== */

drop.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    () => {

        const f =
            fileInput.files?.[0];

        if(f)
            selectFile(f);

    }
);


drop.addEventListener(
    "dragover",
    e => {

        e.preventDefault();

        drop.classList.add(
            "drag"
        );

    }
);


drop.addEventListener(
    "dragleave",
    () => {

        drop.classList.remove(
            "drag"
        );

    }
);


drop.addEventListener(
    "drop",
    e => {

        e.preventDefault();

        drop.classList.remove(
            "drag"
        );

        const f =
            e.dataTransfer
             ?.files?.[0];

        if(f)
            selectFile(f);

    }
);


/* =====================================================
   SELECT PDF
===================================================== */

function selectFile(
    file
){

    if(
        file.type !==
        "application/pdf" &&
        !/\.pdf$/i.test(
            file.name
        )
    ){

        setStatus(
            "Please select a PDF file.",
            "error"
        );

        return;
    }

    selectedFile =
        file;

    nameBox.textContent =
        file.name;

    sizeBox.textContent =
        bytes(file.size);

    info.style.display =
        "block";

    controls.style.display =
        "block";

    progress.style.display =
        "none";

    setStatus(
        "PDF ready.",
        "info"
    );
}


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
    "click",
    () => {

        selectedFile =
            null;

        fileInput.value =
            "";

        info.style.display =
            "none";

        controls.style.display =
            "none";

        progress.style.display =
            "none";

        status.className =
            "status";

        status.textContent =
            "";

    }
);


/* =====================================================
   FIND CONVERTER
===================================================== */

function findConverter(
    module
){

    /*
     * Different WASM package builds can expose
     * their public function differently.

     * Check the known exported names rather than
     * silently pretending conversion succeeded.
     */

    const candidates = [

        "convert",

        "convertPDFToDOCX",

        "convertPdfToDocx",

        "pdfToDocx",

        "PDFToDOCX",

        "PDF2DOCX",

        "Pdf2Docx"

    ];


    for(
        const key of candidates
    ){

        if(
            typeof module[key] ===
            "function"
        ){

            return module[key];

        }

    }


    if(
        module.default &&
        typeof module.default ===
        "function"
    ){

        return module.default;

    }


    if(
        module.default &&
        typeof module.default.convert ===
        "function"
    ){

        return module.default.convert;

    }


    return null;
}


/* =====================================================
   CONVERSION
===================================================== */

convertBtn.addEventListener(
    "click",
    convert
);


async function convert(){

    if(!selectedFile)
        return;


    convertBtn.disabled =
        true;

    resetBtn.disabled =
        true;


    try{

        setProgress(
            5,
            "Loading PDF → Word engine..."
        );


        /*
         * The WASM package itself contains
         * PyMuPDF/pdf2docx/python-docx.
         */

        const converter =
            findConverter(
                PDF2DOCX
            );


        if(!converter){

            /*
             * Do NOT generate a fake DOCX.
             * If the package export differs,
             * stop with a real error.
             */

            throw new Error(
                "The PDF → Word WASM engine could not be initialized."
            );
        }


        setProgress(
            20,
            "Reading PDF..."
        );


        const input =
            new Uint8Array(
                await selectedFile.arrayBuffer()
            );


        setProgress(
            35,
            "Converting PDF layout..."
        );


        /*
         * Try the common binary API first.
         */

        let result;


        try{

            result =
                await converter(
                    input
                );

        }catch(firstError){

            /*
             * Some builds expose an object-style API.
             */

            try{

                result =
                    await converter({
                        input,
                        output:"docx",
                        format:"docx"
                    });

            }catch(secondError){

                console.error(
                    firstError
                );

                console.error(
                    secondError
                );

                throw new Error(
                    "PDF → Word conversion engine rejected this PDF."
                );
            }

        }


        setProgress(
            75,
            "Creating editable DOCX..."
        );


        /*
         * Accept common binary return types.
         */

        let output;


        if(
            result instanceof Blob
        ){

            output =
                result;

        }
        else if(
            result instanceof Uint8Array
        ){

            output =
                new Blob(
                    [result],
                    {
                        type:
                        "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    }
                );

        }
        else if(
            result instanceof ArrayBuffer
        ){

            output =
                new Blob(
                    [result],
                    {
                        type:
                        "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    }
                );

        }
        else if(
            result?.data
        ){

            const data =
                result.data;

            output =
                new Blob(
                    [data],
                    {
                        type:
                        "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    }
                );

        }
        else if(
            result?.docx
        ){

            output =
                new Blob(
                    [result.docx],
                    {
                        type:
                        "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    }
                );

        }
        else{

            console.error(
                "Unexpected converter result:",
                result
            );

            throw new Error(
                "The converter returned an unsupported DOCX result."
            );
        }


        setProgress(
            95,
            "Preparing Word download..."
        );


        download(
            output,
            baseName(
                selectedFile.name
            ) +
            "-editable.docx"
        );


        setProgress(
            100,
            "Completed."
        );


        setStatus(
            "PDF → Word conversion completed.",
            "success"
        );


    }catch(error){

        console.error(
            "PDF → Word error:",
            error
        );


        setProgress(
            0,
            "Conversion failed."
        );


        setStatus(
            error?.message ||
            "PDF → Word conversion failed.",
            "error"
        );


    }finally{

        convertBtn.disabled =
            false;

        resetBtn.disabled =
            false;

    }

}

</script>

</body>
</html>
