<script type="module">

import * as pdfjsLib
    from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

const {
    Document,
    Packer,
    Paragraph,
    TextRun,
    ImageRun,
    AlignmentType,
    PageBreak
} = window.docx;

const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");
const fileInfo = document.getElementById("fileInfo");
const options = document.getElementById("options");
const formatGrid = document.getElementById("formatGrid");
const convertBtn = document.getElementById("convertBtn");
const progress = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const status = document.getElementById("status");
const downloadBox = document.getElementById("downloadBox");
const downloadLink = document.getElementById("downloadLink");

let selectedFile = null;
let selectedFormat = null;

const imageTypes = ["image/jpeg", "image/png", "image/webp"];

const extensionMap = {
    pdf: ["application/pdf"],
    docx: [
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        "application/msword"
    ],
    xlsx: [
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        "application/vnd.ms-excel"
    ],
    pptx: [
        "application/vnd.openxmlformats-officedocument.presentationml.presentation",
        "application/vnd.ms-powerpoint"
    ],
    txt: ["text/plain"]
};

dropzone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
    if (fileInput.files.length) {
        selectFile(fileInput.files[0]);
    }
});

dropzone.addEventListener("dragover", e => {
    e.preventDefault();
    dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.classList.remove("dragover");

    if (e.dataTransfer.files.length) {
        selectFile(e.dataTransfer.files[0]);
    }
});

function selectFile(file) {

    selectedFile = file;
    selectedFormat = null;

    downloadBox.style.display = "none";
    convertBtn.disabled = true;

    fileInfo.style.display = "block";

    fileInfo.innerHTML =
        `<strong>${escapeHtml(file.name)}</strong><br>
         Type: ${escapeHtml(file.type || "Unknown")}<br>
         Size: ${formatBytes(file.size)}`;

    showFormats(file);

    options.style.display = "block";
}

function showFormats(file) {

    formatGrid.innerHTML = "";

    const type = normalizeType(file);

    let formats = [];

    if (type === "pdf") {
        formats = ["docx", "txt", "png"];
    }

    else if (imageTypes.includes(type)) {
        formats = ["jpg", "png", "webp", "pdf"];
    }

    else if (type === "txt") {
        formats = ["pdf", "docx"];
    }

    else if (type === "docx") {
        formats = ["pdf"];
    }

    else if (type === "xlsx") {
        formats = ["pdf"];
    }

    else if (type === "pptx") {
        formats = ["pdf"];
    }

    else {
        formats = [];
    }

    if (!formats.length) {

        formatGrid.innerHTML =
            `<div style="color:#fca5a5">
                This file type is not supported in the current browser version.
             </div>`;

        return;
    }

    formats.forEach(format => {

        const button = document.createElement("button");

        button.type = "button";
        button.className = "format-btn";
        button.textContent = format.toUpperCase();

        button.addEventListener("click", () => {

            document.querySelectorAll(".format-btn")
                .forEach(b => b.classList.remove("active"));

            button.classList.add("active");

            selectedFormat = format;
            convertBtn.disabled = false;
        });

        formatGrid.appendChild(button);
    });
}

convertBtn.addEventListener("click", async () => {

    if (!selectedFile || !selectedFormat) return;

    progress.style.display = "block";
    downloadBox.style.display = "none";
    convertBtn.disabled = true;

    try {

        const type = normalizeType(selectedFile);

        let result;

        if (type === "pdf" && selectedFormat === "docx") {
            result = await pdfToEditableWord(selectedFile);
        }

        else if (type === "pdf" && selectedFormat === "txt") {
            result = await pdfToText(selectedFile);
        }

        else if (type === "pdf" && selectedFormat === "png") {
            result = await pdfToPng(selectedFile);
        }

        else if (imageTypes.includes(type) &&
                 ["jpg","png","webp"].includes(selectedFormat)) {

            result = await imageToImage(selectedFile, selectedFormat);
        }

        else if (imageTypes.includes(type) &&
                 selectedFormat === "pdf") {

            result = await imageToPdf(selectedFile);
        }

        else if (type === "txt" && selectedFormat === "pdf") {
            result = await textToPdf(selectedFile);
        }

        else if (type === "txt" && selectedFormat === "docx") {
            result = await textToDocx(selectedFile);
        }

        else {
            throw new Error(
                "This conversion is not available in the current browser version."
            );
        }

        showDownload(result);

    } catch (error) {

        console.error(error);

        status.textContent =
            error.message || "Conversion failed.";

    } finally {

        convertBtn.disabled = false;
    }
});

async function pdfToEditableWord(file) {

    /*
     * IMPORTANT ARCHITECTURE
     *
     * Every PDF page becomes a high-resolution background image.
     *
     * Native PDF text is extracted where available.
     * For scanned pages, OCR is used.
     *
     * The resulting DOCX therefore preserves the visual form.
     *
     * Editable OCR/native text is placed into Word paragraphs.
     *
     * This is intentionally conservative:
     * it never destroys the original form background.
     */

    setProgress(5, "Reading PDF...");

    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
        data: new Uint8Array(buffer)
    }).promise;

    const sections = [];

    for (let pageNumber = 1;
         pageNumber <= pdf.numPages;
         pageNumber++) {

        setProgress(
            5 + Math.round((pageNumber / pdf.numPages) * 80),
            `Processing page ${pageNumber} of ${pdf.numPages}...`
        );

        const page = await pdf.getPage(pageNumber);

        const viewport = page.getViewport({
            scale: 2
        });

        const canvas = document.createElement("canvas");

        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);

        const context = canvas.getContext("2d", {
            alpha: false
        });

        await page.render({
            canvasContext: context,
            viewport
        }).promise;

        const imageData = canvas.toDataURL(
            "image/png"
        );

        let textContent = await page.getTextContent();

        let textItems = textContent.items
            .map(item => item.str)
            .filter(Boolean);

        let text = textItems.join(" ").trim();

        /*
         * Scanned/image-only page:
         * use French OCR.
         */

        if (text.length < 10) {

            setProgress(
                10 + Math.round(
                    (pageNumber / pdf.numPages) * 80
                ),
                `OCR page ${pageNumber}...`
            );

            const ocr = await Tesseract.recognize(
                canvas,
                "fra+eng",
                {
                    logger: message => {

                        if (
                            message.status ===
                            "recognizing text" &&
                            typeof message.progress === "number"
                        ) {

                            const percent =
                                Math.round(
                                    message.progress * 100
                                );

                            status.textContent =
                                `OCR page ${pageNumber}: ${percent}%`;
                        }
                    }
                }
            );

            text = ocr.data.text.trim();
        }

        sections.push({
            imageData,
            text,
            width: viewport.width,
            height: viewport.height
        });
    }

    setProgress(90, "Building editable Word document...");

    const children = [];

    for (let i = 0; i < sections.length; i++) {

        const section = sections[i];

        const imageBuffer =
            dataUrlToArrayBuffer(section.imageData);

        children.push(
            new Paragraph({
                children: [
                    new ImageRun({
                        data: imageBuffer,
                        transformation: {
                            width: 595,
                            height:
                                Math.round(
                                    595 *
                                    section.height /
                                    section.width
                                )
                        }
                    })
                ],
                spacing: {
                    before: 0,
                    after: 0
                }
            })
        );

        /*
         * Keep extracted/OCR text editable.
         *
         * The background image preserves the exact
         * appearance of the source form.
         */

        if (section.text) {

            children.push(
                new Paragraph({
                    children: [
                        new TextRun({
                            text: section.text,
                            size: 18
                        })
                    ],
                    spacing: {
                        before: 0,
                        after: 0
                    }
                })
            );
        }

        if (i < sections.length - 1) {
            children.push(
                new Paragraph({
                    children: [
                        new PageBreak()
                    ]
                })
            );
        }
    }

    const doc = new Document({
        sections: [
            {
                properties: {
                    page: {
                        size: {
                            width: 11906,
                            height: 16838
                        },
                        margin: {
                            top: 0,
                            bottom: 0,
                            left: 0,
                            right: 0
                        }
                    }
                },
                children
            }
        ]
    });

    const blob = await Packer.toBlob(doc);

    setProgress(100, "Done.");

    return {
        blob,
        name: replaceExtension(file.name, "docx")
    };
}

async function pdfToText(file) {

    setProgress(10, "Extracting PDF text...");

    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
        data: new Uint8Array(buffer)
    }).promise;

    let output = "";

    for (let i = 1; i <= pdf.numPages; i++) {

        const page = await pdf.getPage(i);

        const content =
            await page.getTextContent();

        let text = content.items
            .map(item => item.str)
            .join(" ")
            .trim();

        if (text.length < 10) {

            const viewport =
                page.getViewport({ scale: 2 });

            const canvas =
                document.createElement("canvas");

            canvas.width =
                Math.ceil(viewport.width);

            canvas.height =
                Math.ceil(viewport.height);

            await page.render({
                canvasContext:
                    canvas.getContext("2d"),
                viewport
            }).promise;

            const ocr =
                await Tesseract.recognize(
                    canvas,
                    "fra+eng"
                );

            text = ocr.data.text;
        }

        output +=
            `--- Page ${i} ---\n\n${text}\n\n`;
    }

    setProgress(100, "Done.");

    return {
        blob: new Blob(
            [output],
            { type: "text/plain;charset=utf-8" }
        ),
        name: replaceExtension(file.name, "txt")
    };
}

async function pdfToPng(file) {

    setProgress(20, "Rendering first PDF page...");

    const buffer = await file.arrayBuffer();

    const pdf =
        await pdfjsLib.getDocument({
            data: new Uint8Array(buffer)
        }).promise;

    const page =
        await pdf.getPage(1);

    const viewport =
        page.getViewport({ scale: 2 });

    const canvas =
        document.createElement("canvas");

    canvas.width =
        Math.ceil(viewport.width);

    canvas.height =
        Math.ceil(viewport.height);

    await page.render({
        canvasContext:
            canvas.getContext("2d"),
        viewport
    }).promise;

    const blob =
        await canvasToBlob(
            canvas,
            "image/png"
        );

    setProgress(100, "Done.");

    return {
        blob,
        name: replaceExtension(file.name, "png")
    };
}

async function imageToImage(file, format) {

    setProgress(20, "Reading image...");

    const bitmap =
        await createImageBitmap(file);

    const canvas =
        document.createElement("canvas");

    canvas.width = bitmap.width;
    canvas.height = bitmap.height;

    const ctx =
        canvas.getContext("2d");

    if (format === "jpg") {

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    ctx.drawImage(bitmap, 0, 0);

    const mime =
        format === "jpg"
            ? "image/jpeg"
            : `image/${format}`;

    const blob =
        await canvasToBlob(
            canvas,
            mime,
            format === "jpg" ? .92 : undefined
        );

    setProgress(100, "Done.");

    return {
        blob,
        name: replaceExtension(
            file.name,
            format
        )
    };
}

async function imageToPdf(file) {

    setProgress(20, "Creating PDF...");

    const bitmap =
        await createImageBitmap(file);

    const canvas =
        document.createElement("canvas");

    canvas.width = bitmap.width;
    canvas.height = bitmap.height;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(bitmap, 0, 0);

    const png =
        await canvasToBlob(
            canvas,
            "image/png"
        );

    const imageBytes =
        new Uint8Array(
            await png.arrayBuffer()
        );

    const pdfDoc =
        await PDFLib.PDFDocument.create();

    const image =
        await pdfDoc.embedPng(imageBytes);

    const page =
        pdfDoc.addPage([
            image.width,
            image.height
        ]);

    page.drawImage(image, {
        x: 0,
        y: 0,
        width: image.width,
        height: image.height
    });

    const bytes =
        await pdfDoc.save();

    setProgress(100, "Done.");

    return {
        blob: new Blob(
            [bytes],
            { type: "application/pdf" }
        ),
        name: replaceExtension(
            file.name,
            "pdf"
        )
    };
}

async function textToPdf(file) {

    setProgress(20, "Reading text...");

    const text =
        await file.text();

    const pdfDoc =
        await PDFLib.PDFDocument.create();

    const font =
        await pdfDoc.embedFont(
            PDFLib.StandardFonts.Helvetica
        );

    const page =
        pdfDoc.addPage();

    const {
        width,
        height
    } = page.getSize();

    const lines =
        text.split(/\r?\n/);

    let y =
        height - 50;

    for (const line of lines) {

        if (y < 40) {

            y = height - 50;
            pdfDoc.addPage();
        }

        page.drawText(
            line.substring(0, 110),
            {
                x: 40,
                y,
                size: 10,
                font
            }
        );

        y -= 15;
    }

    const bytes =
        await pdfDoc.save();

    setProgress(100, "Done.");

    return {
        blob: new Blob(
            [bytes],
            { type: "application/pdf" }
        ),
        name: replaceExtension(
            file.name,
            "pdf"
        )
    };
}

async function textToDocx(file) {

    setProgress(30, "Building Word document...");

    const text =
        await file.text();

    const paragraphs =
        text.split(/\r?\n/)
        .map(line =>
            new Paragraph({
                children: [
                    new TextRun(line)
                ]
            })
        );

    const doc =
        new Document({
            sections: [{
                children: paragraphs
            }]
        });

    const blob =
        await Packer.toBlob(doc);

    setProgress(100, "Done.");

    return {
        blob,
        name: replaceExtension(
            file.name,
            "docx"
        )
    };
}

function normalizeType(file) {

    if (file.type) {

        if (file.type === "application/pdf")
            return "pdf";

        if (file.type === "text/plain")
            return "txt";

        if (imageTypes.includes(file.type))
            return file.type;
    }

    const name =
        file.name.toLowerCase();

    if (name.endsWith(".pdf"))
        return "pdf";

    if (name.endsWith(".txt"))
        return "txt";

    if (name.endsWith(".jpg") ||
        name.endsWith(".jpeg"))
        return "image/jpeg";

    if (name.endsWith(".png"))
        return "image/png";

    if (name.endsWith(".webp"))
        return "image/webp";

    if (name.endsWith(".docx"))
        return "docx";

    if (name.endsWith(".xlsx"))
        return "xlsx";

    if (name.endsWith(".pptx"))
        return "pptx";

    return "";
}

function setProgress(percent, message) {

    progressFill.style.width =
        `${Math.max(0, Math.min(100, percent))}%`;

    status.textContent =
        message;
}

function showDownload(result) {

    const url =
        URL.createObjectURL(result.blob);

    downloadLink.href = url;
    downloadLink.download = result.name;

    downloadBox.style.display =
        "block";

    status.textContent =
        "Conversion completed successfully.";
}

function canvasToBlob(
    canvas,
    type,
    quality
) {

    return new Promise(
        (resolve, reject) => {

            canvas.toBlob(
                blob => {

                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(
                            new Error(
                                "Could not create output file."
                            )
                        );
                    }
                },
                type,
                quality
            );
        }
    );
}

function dataUrlToArrayBuffer(dataUrl) {

    const base64 =
        dataUrl.split(",")[1];

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {
        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}

function replaceExtension(
    filename,
    extension
) {

    return filename.replace(
        /\.[^/.]+$/,
        ""
    ) + "." + extension;
}

function formatBytes(bytes) {

    if (!bytes)
        return "0 Bytes";

    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];

    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        Math.round(
            bytes /
            Math.pow(1024, index) *
            100
        ) / 100
    ) + " " + units[index];
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>
