<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF to Word Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07152f;
    color:#fff;
}

.wrap{
    max-width:900px;
    margin:auto;
    padding:30px 16px 60px;
}

h1{
    text-align:center;
    color:#f5c542;
    margin:10px 0 8px;
}

.sub{
    text-align:center;
    color:#b9c5d8;
    margin-bottom:28px;
}

.card{
    background:#0d2144;
    border:1px solid #27436e;
    border-radius:16px;
    padding:22px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.drop{
    border:2px dashed #f5c542;
    border-radius:14px;
    padding:45px 20px;
    text-align:center;
    cursor:pointer;
    background:#091a36;
    display:block;
    transition:.2s;
}

.drop:hover{
    background:#10264b;
}

.drop.active{
    background:#10264b;
}

input[type=file]{
    display:none;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    margin-top:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#f5c542;
    color:#07152f;
}

.primary:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.status{
    margin-top:18px;
    padding:14px;
    border-radius:10px;
    background:#07152f;
    color:#dce5f4;
    white-space:pre-wrap;
    line-height:1.5;
}

.progress{
    width:100%;
    height:9px;
    margin-top:14px;
    background:#07152f;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:#f5c542;
    transition:width .2s;
}

.file{
    margin-top:14px;
    color:#f5c542;
    word-break:break-word;
}
</style>
</head>

<body>

<div class="wrap">

    <h1>PDF → Word</h1>

    <div class="sub">
        Convert PDF pages into an editable Word document locally in your browser.
    </div>

    <div class="card">

        <div class="drop" id="drop">
            <strong>Choose PDF</strong>
            <br><br>
            Tap here or drag & drop your PDF
        </div>

        <input
            id="file"
            type="file"
            accept="application/pdf,.pdf"
        >

        <div class="file" id="filename"></div>

        <button
            class="primary"
            id="convert"
            disabled
        >
            Convert to Word
        </button>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div class="status" id="status">
Select a PDF to begin.
        </div>

    </div>
</div>

<script>

/* =========================================================
   PDF.JS WORKER
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   DOCX
========================================================= */

const {
    Document,
    Packer,
    Paragraph,
    TextRun
} = window.docx;


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput =
    document.getElementById("file");

const drop =
    document.getElementById("drop");

const convertBtn =
    document.getElementById("convert");

const statusBox =
    document.getElementById("status");

const filenameBox =
    document.getElementById("filename");

const bar =
    document.getElementById("bar");


let selectedFile = null;


/* =========================================================
   OPEN FILE PICKER
========================================================= */

drop.addEventListener("click", () => {

    fileInput.click();

});


/* =========================================================
   FILE PICKER
========================================================= */

fileInput.addEventListener("change", event => {

    const file =
        event.target.files &&
        event.target.files[0];

    if (!file) return;

    handleSelectedFile(file);

});


/* =========================================================
   DRAG OVER
========================================================= */

drop.addEventListener("dragover", event => {

    event.preventDefault();
    event.stopPropagation();

    drop.classList.add("active");

});


/* =========================================================
   DRAG LEAVE
========================================================= */

drop.addEventListener("dragleave", event => {

    event.preventDefault();
    event.stopPropagation();

    drop.classList.remove("active");

});


/* =========================================================
   DROP
========================================================= */

drop.addEventListener("drop", event => {

    event.preventDefault();
    event.stopPropagation();

    drop.classList.remove("active");

    const files =
        event.dataTransfer &&
        event.dataTransfer.files;

    if (!files || !files.length) {

        setStatus("No file selected.");

        return;
    }

    const file = files[0];

    if (!isPDF(file)) {

        selectedFile = null;

        filenameBox.textContent = "";

        convertBtn.disabled = true;

        setStatus(
            "Please select a valid PDF file."
        );

        return;
    }

    handleSelectedFile(file);

});


/* =========================================================
   PDF CHECK
========================================================= */

function isPDF(file){

    if (!file) return false;

    return (
        file.type === "application/pdf" ||
        file.name.toLowerCase().endsWith(".pdf")
    );

}


/* =========================================================
   FILE SELECTED
========================================================= */

function handleSelectedFile(file){

    if (!isPDF(file)){

        selectedFile = null;

        filenameBox.textContent = "";

        convertBtn.disabled = true;

        setStatus(
            "Please select a valid PDF file."
        );

        return;
    }

    selectedFile = file;

    filenameBox.textContent =
        file.name +
        " (" +
        formatFileSize(file.size) +
        ")";

    convertBtn.disabled = false;

    setProgress(0);

    setStatus(
        "PDF selected.\n" +
        "Ready to convert."
    );

}


/* =========================================================
   FILE SIZE
========================================================= */

function formatFileSize(bytes){

    if (bytes < 1024){

        return bytes + " B";

    }

    if (bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(2) + " MB";

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(value){

    const safe =
        Math.max(
            0,
            Math.min(100, Number(value) || 0)
        );

    bar.style.width =
        safe + "%";

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    statusBox.textContent =
        String(text || "");

}


/* =========================================================
   CLEAN TEXT
========================================================= */

function cleanText(text){

    return String(text || "")
        .replace(/\u0000/g, "")
        .replace(/\r/g, "")
        .trim();

}


/* =========================================================
   EXTRACT DIRECT PDF TEXT
========================================================= */

async function extractPDFText(page){

    const content =
        await page.getTextContent();

    let result = "";

    let lastY = null;

    for (const item of content.items){

        const value =
            item.str || "";

        if (!value) continue;

        const y =
            item.transform &&
            item.transform.length > 5
                ? item.transform[5]
                : null;

        if (
            lastY !== null &&
            y !== null &&
            Math.abs(y - lastY) > 5
        ){

            result += "\n";

        }else{

            if (result && !result.endsWith("\n")){

                result += " ";

            }

        }

        result += value;

        if (y !== null){

            lastY = y;

        }

    }

    return cleanText(result);

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPage(page){

    const viewport =
        page.getViewport({
            scale:2.5
        });

    const canvas =
        document.createElement("canvas");

    const context =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    canvas.width =
        Math.ceil(viewport.width);

    canvas.height =
        Math.ceil(viewport.height);

    await page.render({

        canvasContext:context,

        viewport

    }).promise;

    return canvas;

}


/* =========================================================
   OCR
========================================================= */

async function OCRPage(
    canvas,
    pageNumber,
    worker
){

    setStatus(
        "OCR processing page " +
        pageNumber +
        "..."
    );

    const result =
        await worker.recognize(canvas);

    return result.data;

}


/* =========================================================
   OCR → PARAGRAPHS
========================================================= */

function createOCRParagraphs(ocr){

    const lines =
        ocr &&
        Array.isArray(ocr.lines)
            ? ocr.lines
            : [];

    const paragraphs = [];

    if (lines.length){

        for (const line of lines){

            const text =
                cleanText(
                    line.text
                );

            if (!text) continue;

            paragraphs.push(

                new Paragraph({

                    children:[
                        new TextRun({
                            text:text,
                            size:22
                        })
                    ],

                    spacing:{
                        after:80
                    }

                })

            );

        }

        return paragraphs;

    }


    const fallback =
        cleanText(
            ocr && ocr.text
                ? ocr.text
                : ""
        );

    if (fallback){

        const lines =
            fallback.split("\n");

        for (const line of lines){

            const text =
                cleanText(line);

            if (!text) continue;

            paragraphs.push(

                new Paragraph({

                    children:[
                        new TextRun({
                            text:text,
                            size:22
                        })
                    ],

                    spacing:{
                        after:80
                    }

                })

            );

        }

    }

    return paragraphs;

}


/* =========================================================
   DIRECT TEXT → PARAGRAPHS
========================================================= */

function createTextParagraphs(text){

    const paragraphs = [];

    const lines =
        String(text || "")
            .split(/\n+/);

    for (const line of lines){

        const value =
            cleanText(line);

        if (!value) continue;

        paragraphs.push(

            new Paragraph({

                children:[
                    new TextRun({
                        text:value,
                        size:22
                    })
                ],

                spacing:{
                    after:100
                }

            })

        );

    }

    return paragraphs;

}


/* =========================================================
   CREATE DOCX
========================================================= */

async function createDocx(pagesData){

    const sections = [];

    for (const page of pagesData){

        let children = [];

        if (page.mode === "text"){

            children =
                createTextParagraphs(
                    page.text
                );

        }

        else if (page.mode === "ocr"){

            children =
                createOCRParagraphs(
                    page.ocr
                );

        }


        if (!children.length){

            children = [

                new Paragraph({

                    children:[
                        new TextRun({
                            text:""
                        })
                    ]

                })

            ];

        }


        sections.push({

            properties:{

                page:{

                    margin:{
                        top:720,
                        bottom:720,
                        left:720,
                        right:720
                    }

                }

            },

            children

        });

    }


    const doc =
        new Document({
            sections
        });


    return await Packer.toBlob(doc);

}


/* =========================================================
   MAIN CONVERSION
========================================================= */

convertBtn.addEventListener(
"click",
async () => {

    if (!selectedFile){

        setStatus(
            "Please select a PDF first."
        );

        return;

    }


    convertBtn.disabled = true;


    try{

        setProgress(3);

        setStatus(
            "Reading PDF file..."
        );


        const buffer =
            await selectedFile.arrayBuffer();


        setProgress(8);


        const pdf =
            await pdfjsLib
                .getDocument({
                    data:buffer
                })
                .promise;


        const pagesData = [];

        let totalCharacters = 0;


        /* =========================================
           FIRST PASS
           Detect real PDF text
        ========================================= */

        for (
            let i = 1;
            i <= pdf.numPages;
            i++
        ){

            const page =
                await pdf.getPage(i);


            const text =
                await extractPDFText(page);


            totalCharacters +=
                text.length;


            pagesData.push({

                page:page,

                text:text

            });


            setProgress(

                8 +
                Math.round(
                    (i / pdf.numPages) * 22
                )

            );

        }


        /* =========================================
           TEXT PDF
        ========================================= */

        if (totalCharacters > 30){

            setStatus(
                "Editable PDF text detected.\n" +
                "Creating Word document..."
            );


            for (const page of pagesData){

                page.mode = "text";

            }

        }


        /* =========================================
           SCANNED PDF
        ========================================= */

        else{

            setStatus(
                "Scanned / image PDF detected.\n" +
                "Starting OCR..."
            );


            /*
             * One worker is reused for all pages.
             * This is the recommended Tesseract.js
             * approach for multiple images.
             */

            const worker =
                await Tesseract.createWorker(
                    "eng"
                );


            try{

                for (
                    let i = 0;
                    i < pagesData.length;
                    i++
                ){

                    const canvas =
                        await renderPage(
                            pagesData[i].page
                        );


                    const ocr =
                        await OCRPage(
                            canvas,
                            i + 1,
                            worker
                        );


                    pagesData[i].mode =
                        "ocr";

                    pagesData[i].ocr =
                        ocr;


                    setProgress(

                        30 +
                        Math.round(
                            ((i + 1) /
                            pagesData.length) *
                            55
                        )

                    );

                }

            }finally{

                await worker.terminate();

            }

        }


        /* =========================================
           CREATE WORD
        ========================================= */

        setStatus(
            "Building editable Word document..."
        );


        setProgress(88);


        const blob =
            await createDocx(
                pagesData
            );


        setProgress(96);


        /* =========================================
           DOWNLOAD
        ========================================= */

        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        const baseName =
            selectedFile.name
                .replace(
                    /\.pdf$/i,
                    ""
                );


        link.href = url;

        link.download =
            baseName +
            "-converted.docx";


        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(
            () => URL.revokeObjectURL(url),
            5000
        );


        setProgress(100);


        setStatus(
            "Conversion complete.\n\n" +
            "The Word document has been downloaded."
        );


    }catch(error){

        console.error(
            "PDF → Word error:",
            error
        );


        setProgress(0);


        setStatus(
            "Error converting PDF.\n\n" +
            (
                error &&
                error.message
                    ? error.message
                    : "Unknown error."
            )
        );


    }finally{

        convertBtn.disabled = false;

    }

});

</script>

</body>
    </html>
