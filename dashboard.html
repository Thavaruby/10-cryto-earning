<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Crypto Faucet</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            margin: 0;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .email {
            color: #555;
            margin-bottom: 20px;
        }

        .balance {
            font-size: 28px;
            margin: 25px 0;
            font-weight: bold;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            font-size: 16px;
            border-radius: 7px;
            cursor: pointer;
            margin: 5px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .action-notification {
    display: none;
    margin: 10px auto 15px;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    max-width: 350px;
    word-break: break-word;
}

.action-notification.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.action-notification.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.action-notification.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
}

        input,
        select {
            width: 90%;
            max-width: 350px;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #ddd;
        }

        /* Notification */

        #topNotification {
            display: none;
            margin: 20px 0;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            word-break: break-word;
        }

        .notification-success {
            background: #dcfce7;
            color: #166534;
        }

        .notification-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .notification-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Withdraw */

        .withdraw-section {
            margin-top: 20px;
        }

        #withdrawMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        /* History buttons */

        .history-buttons {
            margin-top: 25px;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            margin: 8% auto;
            padding: 25px;
            border-radius: 15px;
            position: relative;
            text-align: left;
            box-sizing: border-box;
        }

        .closeButton {
            position: absolute;
            right: 10px;
            top: 10px;
            background: #ef4444;
            padding: 7px 12px;
            margin: 0;
        }

        .history-item {
            padding: 12px;
            margin: 8px 0;
            background: #f3f4f6;
            border-radius: 8px;
            word-break: break-word;
        }

        .logout-button {
            margin-top: 25px;
            background: #374151;
        }

    </style>

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

</head>

<body>

<header>
    <h1>🎁 My Crypto Faucet</h1>
</header>


<div class="container">

    <h2>👤 Dashboard</h2>


    <!-- Notification -->

    <div id="topNotification"></div>


    <!-- User -->

    <div class="email" id="email">
        Loading...
    </div>


    <!-- Balance -->

    <p>My BTC Balance</p>

    <div class="balance">
        💰 <span id="balance">0</span> BTC
    </div>


    <!-- CAPTCHA -->

    <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAEaIQnOPdSP3LRPa"
        data-theme="auto">
    </div>


    <br>


    <!-- Claim -->

    <button
    id="claimButton"
    onclick="claimReward()">

    🎁 CLAIM REWARD

</button>

<div
    id="claimNotification"
    class="action-notification">
</div>

<div
    id="claimCooldown"
    style="
        margin: 10px 0 20px;
        font-weight: bold;
        color: #2563eb;
    ">
</div>


    <!-- Withdrawal -->

    <div class="withdraw-section">

        <h3>💸 Withdraw BTC</h3>
<div style="
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:90%;
    max-width:350px;
    margin:0 auto 8px;
">
    <label for="withdrawAmount">
        <strong>Amount BTC</strong>
        <span style="font-size:13px;color:#666;">
            (Min: 0.0000001 BTC)
        </span>
    </label>

    <button
        type="button"
        onclick="setMaxWithdrawal()"
        style="
            margin:0;
            padding:6px 12px;
            font-size:13px;
        ">
        MAX
    </button>
</div>

<input
    type="number"
    id="withdrawAmount"
    placeholder="Amount BTC"
    step="0.0000001"
    min="0.0000001"
>

        <br><br>

        <select id="withdrawCurrency">

            <option value="BTC">
                BTC
            </option>

        </select>

        <br><br>

        <input
            type="text"
            id="walletAddress"
            placeholder="Your Bitcoin wallet address"
        >

        <br><br>

        <button
    id="withdrawButton"
    onclick="submitWithdrawal()">

    💸 REQUEST WITHDRAWAL

</button>

<div
    id="withdrawNotification"
    class="action-notification">
</div>


    <hr>


    <!-- History buttons -->

    <div class="history-buttons">

        <button onclick="openClaimHistory()">
            📜 CLAIM HISTORY
        </button>

        <button onclick="openWithdrawalHistory()">
            💸 WITHDRAWAL HISTORY
        </button>

    </div>


    <!-- Logout -->

    <button
        class="logout-button"
        onclick="logout()">

        🚪 LOGOUT

    </button>

</div>


<!-- History Modal -->

<div
    id="historyModal"
    class="modal">

    <div class="modal-content">

        <button
            class="closeButton"
            onclick="closeHistory()">

            ✕

        </button>

        <h3 id="historyTitle">
            History
        </h3>

        <div id="historyContent">
            Loading...
        </div>

    </div>

</div>


<script>


/* =========================
   NOTIFICATION
========================= */

/* =========================
   NOTIFICATION
========================= */

function showNotification(message, type = "info") {

    const notification =
        document.getElementById("topNotification");

    notification.className = "";

    notification.classList.add(
        "notification-" + type
    );

    notification.innerText = message;

    notification.style.display = "block";
}


function showActionNotification(
    id,
    message,
    type = "info"
) {

    const notification =
        document.getElementById(id);

    if (!notification) {
        console.error(
            "Notification element not found:",
            id
        );
        return;
    }

    notification.className =
        "action-notification " + type;

    notification.innerText =
        message;

    notification.style.display =
        "block";
}

/* =========================
   LOAD USER
========================= */

async function loadUser() {

    try {

        const response =
            await fetch("/api/me");

        const result =
            await response.json();

        if (!result.success) {

            window.location.href =
                "/login.html";

            return;
        }

        document.getElementById("email")
            .innerText =
            result.user.email;

        document.getElementById("balance")
            .innerText =
            result.user.balance;

    } catch (error) {

        showNotification(
            "❌ Unable to load account.",
            "error"
        );
    }
}
let cooldownTimer = null;

function startClaimCountdown(seconds) {

    const countdown =
        document.getElementById("claimCooldown");

    const button =
        document.getElementById("claimButton");

    if (cooldownTimer) {
        clearInterval(cooldownTimer);
    }

    function updateCountdown() {

        if (seconds <= 0) {

            clearInterval(cooldownTimer);

            countdown.innerText =
                "✅ You can claim now!";

            countdown.style.color =
                "#16a34a";

            button.disabled = false;

            return;
        }

        const hours =
            Math.floor(seconds / 3600);

        const minutes =
            Math.floor(
                (seconds % 3600) / 60
            );

        const secs =
            seconds % 60;

        countdown.innerText =
            `⏳ Next claim available in ${hours}h ${minutes}m ${secs}s`;

        countdown.style.color =
            "#2563eb";

        button.disabled = true;

        seconds--;
    }

    updateCountdown();

    cooldownTimer =
        setInterval(
            updateCountdown,
            1000
        );
    }
async function loadClaimCooldown() {

    try {

        const response =
            await fetch("/api/claim-status");

        const result =
            await response.json();

        if (!result.success) {
            return;
        }

        if (result.canClaim) {

            document.getElementById(
                "claimButton"
            ).disabled = false;

            document.getElementById(
                "claimCooldown"
            ).innerText =
                "✅ You can claim now!";

            document.getElementById(
                "claimCooldown"
            ).style.color =
                "#16a34a";

            return;
        }

        startClaimCountdown(
            result.remainingSeconds
        );

    } catch (error) {

        console.error(
            "Cooldown error:",
            error
        );
    }
    }
/* =========================
   LOGOUT
========================= */

async function logout() {

    showNotification(
        "⏳ Logging out...",
        "info"
    );

    try {

        const response =
            await fetch(
                "/api/logout",
                {
                    method: "POST"
                }
            );

        const result =
            await response.json();

        if (result.success) {

            window.location.href =
                "/login.html";

        } else {

            showNotification(
                "❌ " + result.error,
                "error"
            );
        }

    } catch (error) {

        showNotification(
            "❌ Logout failed. Please try again.",
            "error"
        );
    }
}


/* =========================
   CLAIM REWARD
========================= */

async function claimReward() {

    const button =
        document.getElementById("claimButton");

    button.disabled = true;

    showActionNotification(
        "claimNotification",
        "⏳ Claiming reward...",
        "info"
    );

    try {

        const turnstileToken =
            turnstile.getResponse();

        if (!turnstileToken) {

            showActionNotification(
                "claimNotification",
                "❌ Please complete CAPTCHA verification.",
                "error"
            );

            button.disabled = false;
            return;
        }

        const response =
            await fetch("/api/claim", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    turnstileToken: turnstileToken
                })
            });

        const result =
            await response.json();

        if (result.success) {

            document.getElementById("balance")
                .innerText = result.balance;

            showActionNotification(
                "claimNotification",
                "✅ Reward claimed: " +
                result.reward +
                " BTC",
                "success"
            );

            startClaimCountdown(3600);

            turnstile.reset();

        } else {

            showActionNotification(
                "claimNotification",
                "❌ " + result.error,
                "error"
            );

            if (response.status === 429) {

                const match =
                    result.error.match(
                        /(\d+)h\s+(\d+)m\s+(\d+)s/
                    );

                if (match) {

                    const hours =
                        Number(match[1]);

                    const minutes =
                        Number(match[2]);

                    const seconds =
                        Number(match[3]);

                    const totalSeconds =
                        hours * 3600 +
                        minutes * 60 +
                        seconds;

                    startClaimCountdown(
                        totalSeconds
                    );
                }
            }

            turnstile.reset();
        }

    } catch (error) {

        console.error(
            "Claim error:",
            error
        );

        showActionNotification(
            "claimNotification",
            "❌ Connection error.",
            "error"
        );

    } finally {

        /*
         * Do not enable the button here.
         * Cooldown controls the button state.
         */

    }
}
                       

/* =========================
   WITHDRAW
========================= */

async function submitWithdrawal() {

    const amount =
        Number(
            document.getElementById("withdrawAmount").value
        );

    const walletAddress =
        document.getElementById("walletAddress")
            .value.trim();

    const button =
        document.getElementById("withdrawButton");

    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        showActionNotification(
            "withdrawNotification",
            "❌ Enter a valid BTC amount.",
            "error"
        );

        return;
    }

    if (amount < 0.0000001) {

        showActionNotification(
            "withdrawNotification",
            "❌ Minimum withdrawal is 0.0000001 BTC.",
            "error"
        );

        return;
    }

    if (!walletAddress) {

        showActionNotification(
            "withdrawNotification",
            "❌ Enter your Bitcoin wallet address.",
            "error"
        );

        return;
    }

    button.disabled = true;

    showActionNotification(
        "withdrawNotification",
        "⏳ Submitting withdrawal request...",
        "info"
    );

    try {

        const response =
            await fetch("/api/withdraw", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    amount: amount,

                    currency: "BTC",

                    walletAddress: walletAddress

                })
            });

        const result =
            await response.json();

        if (result.success) {

            /*
             * Update balance immediately
             */
            document.getElementById("balance")
                .innerText = result.balance;

            /*
             * Notification appears
             * directly under REQUEST WITHDRAWAL button
             */
            showActionNotification(
                "withdrawNotification",
                "✅ Withdrawal request submitted. Status: PENDING",
                "success"
            );

            document.getElementById(
                "withdrawAmount"
            ).value = "";

            document.getElementById(
                "walletAddress"
            ).value = "";

        } else {

            showActionNotification(
                "withdrawNotification",
                "❌ " + result.error,
                "error"
            );
        }

    } catch (error) {

        console.error(
            "Withdrawal error:",
            error
        );

        showActionNotification(
            "withdrawNotification",
            "❌ Connection error.",
            "error"
        );

    } finally {

        button.disabled = false;
    }
    }
         

/* =========================
   OPEN CLAIM HISTORY
========================= */

async function openClaimHistory() {

    const modal =
        document.getElementById(
            "historyModal"
        );

    const title =
        document.getElementById(
            "historyTitle"
        );

    const content =
        document.getElementById(
            "historyContent"
        );


    title.innerText =
        "📜 Claim History";

    content.innerHTML =
        "⏳ Loading...";

    modal.style.display =
        "block";


    try {

        const response =
            await fetch(
                "/api/claims"
            );

        const result =
            await response.json();


        if (!result.success) {

            content.innerText =
                "❌ " + result.error;

            return;
        }


        if (
            !result.claims ||
            result.claims.length === 0
        ) {

            content.innerText =
                "No claims yet.";

            return;
        }


        content.innerHTML =
            result.claims
                .map(claim => `

                    <div class="history-item">

                        🎁 Reward:
                        ${claim.reward} BTC

                        <br>

                        🕐
                        ${new Date(
                            claim.claimed_at
                        ).toLocaleString()}

                    </div>

                `)
                .join("");


    } catch (error) {

        content.innerText =
            "❌ Unable to load claim history.";
    }
}


/* =========================
   OPEN WITHDRAWAL HISTORY
========================= */

async function openWithdrawalHistory() {

    const modal =
        document.getElementById(
            "historyModal"
        );

    const title =
        document.getElementById(
            "historyTitle"
        );

    const content =
        document.getElementById(
            "historyContent"
        );


    title.innerText =
        "💸 Withdrawal History";

    content.innerHTML =
        "⏳ Loading...";

    modal.style.display =
        "block";


    try {

        const response =
            await fetch(
                "/api/withdrawals"
            );

        const result =
            await response.json();


        if (!result.success) {

            content.innerText =
                "❌ " + result.error;

            return;
        }


        if (
            !result.withdrawals ||
            result.withdrawals.length === 0
        ) {

            content.innerText =
                "No withdrawal requests yet.";

            return;
        }


        content.innerHTML =
            result.withdrawals
                .map(withdrawal => `

                    <div class="history-item">

                        💰 Amount:
                        ${withdrawal.amount}
                        BTC

                        <br>

                        🏦 Wallet:
                        ${withdrawal.wallet_address}

                        <br>

                        📌 Status:
                        ${withdrawal.status.toUpperCase()}

                        <br>

                        🕐 Date:
                        ${new Date(
                            withdrawal.created_at
                        ).toLocaleString()}

                    </div>

                `)
                .join("");


    } catch (error) {

        content.innerText =
            "❌ Unable to load withdrawal history.";
    }
}


/* =========================
   CLOSE HISTORY
========================= */

function closeHistory() {

    document.getElementById(
        "historyModal"
    ).style.display =
        "none";
}


/* =========================
   CLOSE MODAL BY BACKGROUND
========================= */

window.onclick = function(event) {

    const modal =
        document.getElementById(
            "historyModal"
        );

    if (event.target === modal) {

        closeHistory();
    }
};


/* =========================
   INITIAL LOAD
========================= */

loadUser();
loadClaimCooldown();

</script>

</body>
    </html>
