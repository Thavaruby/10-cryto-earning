<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Crypto Faucet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            margin: 0;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .balance {
            font-size: 28px;
            margin: 25px 0;
            font-weight: bold;
        }

        .email {
            color: #555;
            margin-bottom: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 30px;
            font-size: 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎁 My Crypto Faucet</h1>
</header>

<div class="container">

    <h2>👤 Dashboard</h2>

    <div class="email" id="email">
        Loading...
    </div>

    <div class="balance">
        💰 <span id="balance">0</span>
    </div>

    <p>Current Balance</p>

    <button id="claimButton" onclick="claimReward()">
    🎁 CLAIM REWARD
    </button>

    <h3>📜 Claim History</h3>

<div id="claimHistory">
    ⏳ Loading...
</div>

    <button onclick="logout()">
        LOGOUT
    </button>

    <div id="message"></div>

</div>

<script>

async function loadUser() {

    try {

        const response =
            await fetch("/api/me");

        const result =
            await response.json();

        if (!result.success) {

            window.location.href =
                "/login.html";

            return;
        }

        document.getElementById("email")
            .innerText =
            result.user.email;

        document.getElementById("balance")
            .innerText =
            result.user.balance;

    } catch (error) {

        document.getElementById("message")
            .innerText =
            "❌ Unable to load account.";
    }
}

async function logout() {

    const message =
        document.getElementById("message");

    message.innerText =
        "⏳ Logging out...";

    try {

        const response =
            await fetch("/api/logout", {
                method: "POST"
            });

        const result =
            await response.json();

        if (result.success) {

            window.location.href =
                "/login.html";

        } else {

            message.innerText =
                "❌ " + result.error;
        }

    } catch (error) {

        message.innerText =
            "❌ Logout failed. Please try again.";
    }
}

async function claimReward() {

    const button =
        document.getElementById("claimButton");

    const message =
        document.getElementById("message");

    button.disabled = true;

    message.innerText =
        "⏳ Claiming reward...";

    try {

        const response =
            await fetch("/api/claim", {
                method: "POST"
            });

        const result =
            await response.json();

        if (result.success) {

            document.getElementById("balance")
                .innerText =
                result.balance;

            message.innerText =
                "✅ Reward claimed: " +
                result.reward;

        } else {

            message.innerText =
                "❌ " + result.error;
        }

    } catch (error) {

        message.innerText =
            "❌ Connection error.";

    } finally {

        button.disabled = false;
    }
}
async function loadClaimHistory() {

    const history =
        document.getElementById("claimHistory");

    try {

        const response =
            await fetch("/api/claims");

        const result =
            await response.json();

        if (!result.success) {
            history.innerText =
                "❌ " + result.error;
            return;
        }

        if (result.claims.length === 0) {
            history.innerText =
                "No claims yet.";
            return;
        }

        history.innerHTML = result.claims
            .map(claim => `
                <div style="
                    padding:10px;
                    margin:8px 0;
                    background:#f3f4f6;
                    border-radius:8px;
                ">
                    🎁 Reward: ${claim.reward}<br>
                    🕐 ${new Date(claim.claimed_at).toLocaleString()}
                </div>
            `)
            .join("");

    } catch (error) {

        history.innerText =
            "❌ Unable to load claim history.";
    }
}

loadUser();
loadClaimHistory();
    
</script>

</body>
</html>
