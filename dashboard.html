<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Crypto Faucet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            margin: 0;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .balance {
            font-size: 28px;
            margin: 25px 0;
            font-weight: bold;
        }

        .email {
            color: #555;
            margin-bottom: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 30px;
            font-size: 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎁 My Crypto Faucet</h1>
</header>

<div class="container">

    <h2>👤 Dashboard</h2>

    <div class="email" id="email">
        Loading...
    </div>

    <div class="balance">
        💰 <span id="balance">0</span>
    </div>

    <p>Current Balance</p>

    <button onclick="logout()">
        LOGOUT
    </button>

    <div id="message"></div>

</div>

<script>

async function loadUser() {

    try {

        const response =
            await fetch("/api/me");

        const result =
            await response.json();

        if (!result.success) {

            window.location.href =
                "/login.html";

            return;
        }

        document.getElementById("email")
            .innerText =
            result.user.email;

        document.getElementById("balance")
            .innerText =
            result.user.balance;

    } catch (error) {

        document.getElementById("message")
            .innerText =
            "❌ Unable to load account.";
    }
}

async function logout() {

    document.getElementById("message")
        .innerText =
        "Logging out...";

    // Logout function will be added in the next step.
}

loadUser();

</script>

</body>
</html>
