<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Crypto Faucet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            margin: 0;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .balance {
            font-size: 28px;
            margin: 25px 0;
            font-weight: bold;
        }

        .email {
            color: #555;
            margin-bottom: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 30px;
            font-size: 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>

<header>
    <h1>🎁 My Crypto Faucet</h1>
</header>

<div class="container">

    <h2>👤 Dashboard</h2>

    <div class="email" id="email">
        Loading...
    </div>

    <div class="balance">
        💰 <span id="balance">0</span>
    </div>

    <p>Current Balance</p>

<div
    class="cf-turnstile"
    data-sitekey="0x4AAAAAAEaIQnOPdSP3LRPa"
    data-theme="auto">
</div>

<br>

<button id="claimButton" onclick="claimReward()">
    🎁 CLAIM REWARD
</button>

  <hr>

<h3>💸 Withdraw</h3>

<input
    type="number"
    id="withdrawAmount"
    placeholder="Amount"
    step="0.000001"
    min="0.00001"
>

<br><br>

<select id="withdrawCurrency">
    <option value="BTC">BTC</option>
</select>

<br><br>

<input
    type="text"
    id="walletAddress"
    placeholder="Your wallet address"
>

<br><br>

<button id="withdrawButton" onclick="submitWithdrawal()">
    💸 REQUEST WITHDRAWAL
</button>

<div id="withdrawMessage"></div>  
    <h3>📜 Claim History</h3>

<div id="claimHistory">
    ⏳ Loading...
</div>
<hr>

<h3>💸 Withdrawal History</h3>

<div id="withdrawalHistory">
    ⏳ Loading...
</div>
    <button onclick="logout()">
        LOGOUT
    </button>

    <div id="message"></div>

</div>

<script>

    
async function loadUser() {

    try {

        const response =
            await fetch("/api/me");

        const result =
            await response.json();

        if (!result.success) {

            window.location.href =
                "/login.html";

            return;
        }

        document.getElementById("email")
            .innerText =
            result.user.email;

        document.getElementById("balance")
            .innerText =
            result.user.balance;

    } catch (error) {

        document.getElementById("message")
            .innerText =
            "❌ Unable to load account.";
    }
}

async function logout() {

    const message =
        document.getElementById("message");

    message.innerText =
        "⏳ Logging out...";

    try {

        const response =
            await fetch("/api/logout", {
                method: "POST"
            });

        const result =
            await response.json();

        if (result.success) {

            window.location.href =
                "/login.html";

        } else {

            message.innerText =
                "❌ " + result.error;
        }

    } catch (error) {

        message.innerText =
            "❌ Logout failed. Please try again.";
    }
}

async function claimReward() {

    const button =
        document.getElementById("claimButton");

    const message =
        document.getElementById("message");

    button.disabled = true;

    message.innerText =
        "⏳ Claiming reward...";

    try {

        const turnstileToken =
    turnstile.getResponse();

if (!turnstileToken) {

    message.innerText =
        "❌ Please complete verification.";

    button.disabled = false;
    return;
}

const response =
    await fetch("/api/claim", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            turnstileToken: turnstileToken
        })
    });

        const result =
            await response.json();

        if (result.success) {

            document.getElementById("balance")
                .innerText =
                result.balance;

            message.innerText =
                "✅ Reward claimed: " +
                result.reward;

        } else {

            message.innerText =
                "❌ " + result.error;
        }

    } catch (error) {

        message.innerText =
            "❌ Connection error.";

    } finally {

        button.disabled = false;
    }
}
async function submitWithdrawal() {

    const amount =
        Number(
            document.getElementById("withdrawAmount").value
        );

    const currency =
        document.getElementById("withdrawCurrency").value;

    const walletAddress =
        document.getElementById("walletAddress").value.trim();

    const button =
        document.getElementById("withdrawButton");

    const message =
        document.getElementById("withdrawMessage");

    if (!Number.isFinite(amount) || amount <= 0) {
        message.innerText =
            "❌ Enter a valid amount.";
        return;
    }

    if (amount < 0.00001) {
        message.innerText =
            "❌ Minimum withdrawal is 0.00001.";
        return;
    }

    if (!walletAddress) {
        message.innerText =
            "❌ Enter your wallet address.";
        return;
    }

    button.disabled = true;

    message.innerText =
        "⏳ Submitting withdrawal request...";

    try {

        const response =
            await fetch("/api/withdraw", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    amount: amount,
                    currency: currency,
                    walletAddress: walletAddress
                })
            });

        const result =
            await response.json();

        if (result.success) {

            message.innerText =
                "✅ Withdrawal request submitted. Status: PENDING";

            document.getElementById("withdrawAmount")
                .value = "";

            document.getElementById("walletAddress")
                .value = "";

        } else {

            message.innerText =
                "❌ " + result.error;
        }

    } catch (error) {

        console.error(error);

        message.innerText =
            "❌ Connection error.";
    }

    button.disabled = false;
}
    
async function loadClaimHistory() {

    const history =
        document.getElementById("claimHistory");

    try {

        const response =
            await fetch("/api/claims");

        const result =
            await response.json();

        if (!result.success) {
            history.innerText =
                "❌ " + result.error;
            return;
        }

        if (result.claims.length === 0) {
            history.innerText =
                "No claims yet.";
            return;
        }

        history.innerHTML = result.claims
            .map(claim => `
                <div style="
                    padding:10px;
                    margin:8px 0;
                    background:#f3f4f6;
                    border-radius:8px;
                ">
                    🎁 Reward: ${claim.reward}<br>
                    🕐 ${new Date(claim.claimed_at).toLocaleString()}
                </div>
            `)
            .join("");

    } catch (error) {

        history.innerText =
            "❌ Unable to load claim history.";
    }
}
async function loadWithdrawalHistory() {

    const history =
        document.getElementById("withdrawalHistory");

    try {

        const response =
            await fetch("/api/withdrawals");

        const result =
            await response.json();

        if (!result.success) {
            history.innerText =
                "❌ " + result.error;
            return;
        }

        if (result.withdrawals.length === 0) {
            history.innerText =
                "No withdrawal requests yet.";
            return;
        }

        history.innerHTML = result.withdrawals
            .map(withdrawal => `
                <div style="
                    padding:10px;
                    margin:8px 0;
                    background:#f3f4f6;
                    border-radius:8px;
                    text-align:left;
                ">
                    💰 Amount:
                    ${withdrawal.amount}
                    ${withdrawal.currency}
                    <br>

                    🏦 Wallet:
                    ${withdrawal.wallet_address}
                    <br>

                    📌 Status:
                    ${withdrawal.status.toUpperCase()}
                    <br>

                    🕐 Date:
                    ${new Date(
                        withdrawal.created_at
                    ).toLocaleString()}
                </div>
            `)
            .join("");

    } catch (error) {

        history.innerText =
            "❌ Unable to load withdrawal history.";
    }
    }
loadUser();
loadClaimHistory();
loadWithdrawalHistory(); 
    
</script>

</body>
</html>
