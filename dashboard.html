<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - My Crypto Faucet</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:white;

    background:
        radial-gradient(circle at 20% 20%,rgba(37,99,235,.25),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(124,58,237,.22),transparent 35%),
        linear-gradient(135deg,#07111f,#0d1b2f 45%,#111827);

    position:relative;
}

/* BACKGROUND GLOW */

body::before{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    background:rgba(37,99,235,.15);
    filter:blur(70px);
    border-radius:50%;
    top:10%;
    left:-100px;
    animation:floatGlow 7s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
}

body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    background:rgba(168,85,247,.13);
    filter:blur(80px);
    border-radius:50%;
    bottom:-100px;
    right:-80px;
    animation:floatGlow 8s ease-in-out infinite reverse;
    pointer-events:none;
    z-index:0;
}

@keyframes floatGlow{
    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(30px,-25px);
    }
}

/* =========================================
   HEADER
========================================= */

.crypto-header{
    position:relative;
    z-index:2;
    padding:28px 18px 90px;
    text-align:center;
}

.brand{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.logo-coin{
    width:48px;
    height:48px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(145deg,#fbbf24,#f59e0b);
    color:#111827;

    font-size:25px;
    font-weight:bold;

    box-shadow:
        0 0 0 4px rgba(251,191,36,.12),
        0 0 25px rgba(251,191,36,.35);

    animation:coinPulse 2.5s ease-in-out infinite;
}

@keyframes coinPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }
}

.brand h1{
    margin:0;
    font-size:27px;
    letter-spacing:.3px;
}

.brand-subtitle{
    margin:8px 0 0;
    color:#94a3b8;
    font-size:13px;
}

/* =========================================
   BITCOIN HOURLY CARD
========================================= */

.faucet-banner{
    position:relative;

    width:min(94%,850px);
    min-height:180px;

    margin:32px auto 0;

    display:flex;
    align-items:center;

    overflow:hidden;

    border-radius:24px;

    background:
        radial-gradient(circle at 18% 50%,rgba(245,158,11,.16),transparent 32%),
        radial-gradient(circle at 82% 30%,rgba(37,99,235,.20),transparent 35%),
        linear-gradient(135deg,#07111f,#0d1b35 48%,#111c36);

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);

    text-align:left;
}

.faucet-banner::before{
    content:"";

    position:absolute;

    width:280px;
    height:280px;

    left:-130px;
    top:-50px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(245,158,11,.15),
        transparent 68%
    );
}
