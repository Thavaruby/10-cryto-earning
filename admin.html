<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Crypto Faucet</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: calc(100% - 30px);
            max-width: 1200px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            margin: 0;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .refresh {
            background: #2563eb;
            color: white;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
        }

        .tab {
            background: #e5e7eb;
            color: #374151;
        }

        .tab.active {
            background: #111827;
            color: white;
        }

        .tab.pending.active {
            background: #d97706;
        }

        .tab.approved.active {
            background: #16a34a;
        }

        .tab.rejected.active {
            background: #dc2626;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
            min-height: 20px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 13px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        th {
            background: #f9fafb;
            font-size: 13px;
            text-transform: uppercase;
            color: #4b5563;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status.approved {
            background: #dcfce7;
            color: #166534;
        }

        .status.rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .wallet {
            max-width: 180px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }

        .id-text {
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .amount {
            font-weight: bold;
            white-space: nowrap;
        }

        .actions {
            white-space: nowrap;
        }

        .approve {
            background: #16a34a;
            color: white;
            margin-right: 4px;
        }

        .reject {
            background: #dc2626;
            color: white;
        }

        .empty {
            padding: 35px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 15px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .page-button {
            background: #111827;
            color: white;
        }

        .page-info {
            font-weight: bold;
            color: #4b5563;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .modal h3 {
            margin-top: 0;
        }

        .modal-text {
            color: #4b5563;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-button {
            background: #e5e7eb;
            color: #111827;
        }

        .confirm-button {
            background: #111827;
            color: white;
        }

        .confirm-button.approve-confirm {
            background: #16a34a;
        }

        .confirm-button.reject-confirm {
            background: #dc2626;
        }

        @media (max-width: 600px) {

            .container {
                width: calc(100% - 16px);
                margin: 15px auto;
                padding: 15px;
            }

            header {
                padding: 16px;
            }

            header h1 {
                font-size: 20px;
            }

            .top-bar {
                align-items: stretch;
            }

            .refresh {
                width: 100%;
            }

            .tabs {
                display: grid;
                grid-template-columns: 1fr;
            }

            .tab {
                width: 100%;
            }
        }

    </style>

</head>

<body>


<header>

    <h1>🔐 Admin Dashboard</h1>

</header>


<div class="container">


    <div class="top-bar">

        <h2>💸 BTC Withdrawals</h2>

        <button
            class="refresh"
            id="refreshButton"
            onclick="loadWithdrawals()"
        >
            🔄 REFRESH
        </button>

    </div>


    <!-- =========================
         TABS
    ========================== -->

    <div class="tabs">

        <button
            class="tab pending active"
            data-status="pending"
            onclick="changeTab('pending')"
        >
            🟠 PENDING
        </button>

        <button
            class="tab approved"
            data-status="approved"
            onclick="changeTab('approved')"
        >
            🟢 APPROVED
        </button>

        <button
            class="tab rejected"
            data-status="rejected"
            onclick="changeTab('rejected')"
        >
            🔴 REJECTED
        </button>

    </div>


    <div id="message">
        ⏳ Loading...
    </div>


    <!-- =========================
         WITHDRAWAL TABLE
    ========================== -->

    <div id="withdrawals"></div>


    <!-- =========================
         PAGINATION
    ========================== -->

    <div
        class="pagination"
        id="pagination"
        style="display:none;"
    >

        <button
            class="page-button"
            id="previousButton"
            onclick="previousPage()"
        >
            ← Previous
        </button>

        <span
            class="page-info"
            id="pageInfo"
        >
            Page 1
        </span>

        <button
            class="page-button"
            id="nextButton"
            onclick="nextPage()"
        >
            Next →
        </button>

    </div>

</div>


<!-- =========================
     CONFIRMATION MODAL
========================== -->

<div
    class="modal-overlay"
    id="confirmModal"
>

    <div class="modal">

        <h3 id="modalTitle">
            Confirm Action
        </h3>

        <div
            class="modal-text"
            id="modalText"
        >
            Are you sure?
        </div>

        <div class="modal-actions">

            <button
                class="cancel-button"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button
                class="confirm-button"
                id="confirmActionButton"
                onclick="confirmWithdrawalAction()"
            >
                Confirm
            </button>

        </div>

    </div>

</div>


<script>


/* =========================
   STATE
========================= */

let currentStatus = "pending";

let currentPage = 1;

const itemsPerPage = 10;

let allWithdrawals = [];

let selectedWithdrawalId = null;

let selectedAction = null;

let processing = false;


/* =========================
   CHANGE TAB
========================= */

function changeTab(status) {

    if (processing) {
        return;
    }

    currentStatus = status;

    currentPage = 1;

    document
        .querySelectorAll(".tab")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.status === status
            );

        });

    loadWithdrawals();
}


/* =========================
   LOAD WITHDRAWALS
========================= */

async function loadWithdrawals() {

    const message =
        document.getElementById("message");

    const container =
        document.getElementById("withdrawals");

    const pagination =
        document.getElementById("pagination");

    const refreshButton =
        document.getElementById("refreshButton");


    message.innerText =
        `⏳ Loading ${currentStatus} withdrawals...`;

    container.innerHTML = "";

    pagination.style.display = "none";

    refreshButton.disabled = true;


    try {

        const response =
            await fetch(
                `/api/admin/withdrawals?status=${encodeURIComponent(currentStatus)}`,
                {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                }
            );


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            message.innerText =
                "❌ " + (
                    result.error ||
                    "Unable to load withdrawals."
                );

            allWithdrawals = [];

            return;
        }


        allWithdrawals =
            Array.isArray(result.withdrawals)
                ? result.withdrawals
                : [];


        if (allWithdrawals.length === 0) {

            message.innerText =
                `0 ${currentStatus} BTC withdrawal(s)`;

            container.innerHTML = `
                <div class="empty">
                    ${
                        currentStatus === "pending"
                            ? "✅ No pending BTC withdrawals."
                            : currentStatus === "approved"
                                ? "📭 No approved BTC withdrawals."
                                : "📭 No rejected BTC withdrawals."
                    }
                </div>
            `;

            return;
        }


        message.innerText =
            `${allWithdrawals.length} ${currentStatus} BTC withdrawal(s)`;


        renderWithdrawals();


    } catch (error) {

        console.error(
            "Load withdrawals error:",
            error
        );

        message.innerText =
            "❌ Unable to load withdrawals.";

        container.innerHTML = "";

    } finally {

        refreshButton.disabled = false;

    }
}


/* =========================
   RENDER
========================= */

function renderWithdrawals() {

    const container =
        document.getElementById("withdrawals");

    const pagination =
        document.getElementById("pagination");


    const totalPages =
        Math.ceil(
            allWithdrawals.length /
            itemsPerPage
        );


    if (currentPage > totalPages) {
        currentPage = totalPages;
    }


    const start =
        (currentPage - 1) *
        itemsPerPage;


    const end =
        start + itemsPerPage;


    const pageItems =
        allWithdrawals.slice(
            start,
            end
        );


    container.innerHTML = `

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>User</th>

                        <th>Amount</th>

                        <th>Wallet</th>

                        <th>Status</th>

                        <th>Payout ID</th>

                        <th>TXID</th>

                        <th>Created</th>

                        <th>Processed</th>

                        ${
                            currentStatus === "pending"
                                ? "<th>Actions</th>"
                                : ""
                        }

                    </tr>

                </thead>

                <tbody>

                    ${
                        pageItems
                            .map(item =>
                                createWithdrawalRow(item)
                            )
                            .join("")
                    }

                </tbody>

            </table>

        </div>

    `;


    /* =========================
       PAGINATION UI
    ========================== */

    pagination.style.display =
        totalPages > 1
            ? "flex"
            : "none";


    document.getElementById(
        "pageInfo"
    ).innerText =
        `Page ${currentPage} of ${totalPages}`;


    document.getElementById(
        "previousButton"
    ).disabled =
        currentPage <= 1;


    document.getElementById(
        "nextButton"
    ).disabled =
        currentPage >= totalPages;
}


/* =========================
   CREATE TABLE ROW
========================= */

function createWithdrawalRow(item) {

    const status =
        String(
            item.status || ""
        ).toLowerCase();


    const created =
        formatDate(
            item.created_at
        );


    const processed =
        item.processed_at
            ? formatDate(item.processed_at)
            : "—";


    const payoutId =
        item.payout_id
            ? escapeHtml(
                String(item.payout_id)
            )
            : "—";


    const txid =
        item.txid
            ? escapeHtml(
                String(item.txid)
            )
            : "—";


    return `

        <tr>

            <td>
                <strong>#${escapeHtml(String(item.id))}</strong>
            </td>


            <td>

                <strong>
                    ${escapeHtml(
                        item.email || "N/A"
                    )}
                </strong>

                <br>

                <small>
                    User ID:
                    ${escapeHtml(
                        String(item.user_id)
                    )}
                </small>

            </td>


            <td class="amount">

                ${escapeHtml(
                    String(item.amount)
                )}
                BTC

            </td>


            <td>

                <div class="wallet">

                    ${escapeHtml(
                        item.wallet_address || "N/A"
                    )}

                </div>

            </td>


            <td>

                <span class="status ${status}">

                    ${escapeHtml(
                        status.toUpperCase()
                    )}

                </span>

            </td>


            <td>

                <span class="id-text">

                    ${payoutId}

                </span>

            </td>


            <td>

                <span class="id-text">

                    ${txid}

                </span>

            </td>


            <td>

                ${created}

            </td>


            <td>

                ${processed}

            </td>


            ${
                currentStatus === "pending"
                    ? `

                    <td class="actions">

                        <button
                            class="approve"
                            onclick="openConfirmation(
                                ${Number(item.id)},
                                'approve'
                            )"
                        >
                            ✅ Approve
                        </button>

                        <button
                            class="reject"
                            onclick="openConfirmation(
                                ${Number(item.id)},
                                'reject'
                            )"
                        >
                            ❌ Reject
                        </button>

                    </td>

                    `
                    : ""
            }

        </tr>

    `;
}


/* =========================
   CONFIRMATION MODAL
========================= */

function openConfirmation(
    id,
    action
) {

    if (processing) {
        return;
    }


    selectedWithdrawalId = id;

    selectedAction = action;


    const modal =
        document.getElementById(
            "confirmModal"
        );

    const title =
        document.getElementById(
            "modalTitle"
        );

    const text =
        document.getElementById(
            "modalText"
        );

    const confirmButton =
        document.getElementById(
            "confirmActionButton"
        );


    if (action === "approve") {

        title.innerText =
            "Approve Withdrawal?";

        text.innerHTML =
            `Are you sure you want to approve withdrawal <strong>#${id}</strong>?<br><br>
             This will send the BTC payout through FaucetPay.`;

        confirmButton.innerText =
            "✅ Approve";

        confirmButton.className =
            "confirm-button approve-confirm";

    } else {

        title.innerText =
            "Reject Withdrawal?";

        text.innerHTML =
            `Are you sure you want to reject withdrawal <strong>#${id}</strong>?<br><br>
             The reserved BTC will be refunded to the user.`;

        confirmButton.innerText =
            "❌ Reject";

        confirmButton.className =
            "confirm-button reject-confirm";

    }


    modal.classList.add("show");
}


/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

    document
        .getElementById(
            "confirmModal"
        )
        .classList.remove("show");


    selectedWithdrawalId = null;

    selectedAction = null;
}


/* =========================
   CONFIRM ACTION
========================= */

async function confirmWithdrawalAction() {

    if (
        processing ||
        !selectedWithdrawalId ||
        !selectedAction
    ) {
        return;
    }


    const id =
        selectedWithdrawalId;

    const action =
        selectedAction;


    closeModal();


    processing = true;


    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        "⏳ Processing withdrawal...";


    try {

        const response =
            await fetch(
                "/api/admin/withdrawal-action",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body: JSON.stringify({

                        withdrawalId: id,

                        action: action

                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            message.innerText =
                "❌ " + (
                    result.error ||
                    "Unable to process withdrawal."
                );

            return;
        }


        if (
            result.status ===
            "approved"
        ) {

            message.innerText =
                "✅ Withdrawal approved successfully.";

        } else if (
            result.status ===
            "rejected"
        ) {

            message.innerText =
                "✅ Withdrawal rejected. BTC refunded to user.";

        } else {

            message.innerText =
                "✅ Withdrawal processed.";

        }


        /*
         * Reload current tab.
         */

        await loadWithdrawals();


    } catch (error) {

        console.error(
            "Process withdrawal error:",
            error
        );

        message.innerText =
            "❌ Connection error.";

    } finally {

        processing = false;

    }
}


/* =========================
   PAGINATION
========================= */

function previousPage() {

    if (currentPage <= 1) {
        return;
    }

    currentPage--;

    renderWithdrawals();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function nextPage() {

    const totalPages =
        Math.ceil(
            allWithdrawals.length /
            itemsPerPage
        );


    if (currentPage >= totalPages) {
        return;
    }

    currentPage++;

    renderWithdrawals();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   DATE FORMAT
========================= */

function formatDate(value) {

    if (!value) {
        return "—";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return escapeHtml(
            String(value)
        );
    }


    return escapeHtml(
        date.toLocaleString()
    );
}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   CLOSE MODAL
   WHEN CLICK OUTSIDE
========================= */

document
    .getElementById("confirmModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {
                closeModal();
            }

        }
    );


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {
            closeModal();
        }

    }
);


/* =========================
   INITIAL LOAD
========================= */

loadWithdrawals();


</script>

</body>

</html>
