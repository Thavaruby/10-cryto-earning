<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Crypto Faucet</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: calc(100% - 30px);
            max-width: 1200px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            margin: 0;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .refresh {
            background: #2563eb;
            color: white;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
        }

        .tab {
            background: #e5e7eb;
            color: #374151;
        }

        .tab.active {
            background: #111827;
            color: white;
        }

        .tab.pending.active {
            background: #d97706;
        }

        .tab.approved.active {
            background: #16a34a;
        }

        .tab.rejected.active {
            background: #dc2626;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
            min-height: 20px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 13px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        th {
            background: #f9fafb;
            font-size: 13px;
            text-transform: uppercase;
            color: #4b5563;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status.approved {
            background: #dcfce7;
            color: #166534;
        }

        .status.rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .wallet {
            max-width: 180px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }

        .id-text {
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .amount {
            font-weight: bold;
            white-space: nowrap;
        }

        .actions {
            white-space: nowrap;
        }

        .approve {
            background: #16a34a;
            color: white;
            margin-right: 4px;
        }

        .reject {
            background: #dc2626;
            color: white;
        }

        .empty {
            padding: 35px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 15px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .page-button {
            background: #111827;
            color: white;
        }

        .page-info {
            font-weight: bold;
            color: #4b5563;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .modal h3 {
            margin-top: 0;
        }

        .modal-text {
            color: #4b5563;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-button {
            background: #e5e7eb;
            color: #111827;
        }

        .confirm-button {
            background: #111827;
            color: white;
        }

        .confirm-button.approve-confirm {
            background: #16a34a;
        }

        .confirm-button.reject-confirm {
            background: #dc2626;
        }

        @media (max-width: 600px) {

            .container {
                width: calc(100% - 16px);
                margin: 15px auto;
                padding: 15px;
            }

            header {
                padding: 16px;
            }

            header h1 {
                font-size: 20px;
            }

            .top-bar {
                align-items: stretch;
            }

            .refresh {
                width: 100%;
            }

            .tabs {
                display: grid;
                grid-template-columns: 1fr;
            }

            .tab {
                width: 100%;
            }
        }

    </style>

</head>

<body>


<header>

    <h1>🔐 Admin Dashboard</h1>

</header>


<div class="container">


    <div class="top-bar">

        <h2>💸 BTC Withdrawals</h2>

        <button
            class="refresh"
            id="refreshButton"
            onclick="loadWithdrawals()"
        >
            🔄 REFRESH
        </button>

    </div>


    <!-- =========================
         TABS
    ========================== -->

    <div class="tabs">

        <button
            class="tab pending active"
            data-status="pending"
            onclick="changeTab('pending')"
        >
            🟠 PENDING
        </button>

        <button
            class="tab approved"
            data-status="approved"
            onclick="changeTab('approved')"
        >
            🟢 APPROVED
        </button>

        <button
            class="tab rejected"
            data-status="rejected"
            onclick="changeTab('rejected')"
        >
            🔴 REJECTED
        </button>

    </div>


    <div id="message">
        ⏳ Loading...
    </div>


    <!-- =========================
         WITHDRAWAL TABLE
    ========================== -->

    <div id="withdrawals"></div>


    <!-- =========================
         PAGINATION
    ========================== -->

    <div
        class="pagination"
        id="pagination"
        style="display:none;"
    >

        <button
            class="page-button"
            id="previousButton"
            onclick="previousPage()"
        >
            ← Previous
        </button>

        <span
            class="page-info"
            id="pageInfo"
        >
            Page 1
        </span>

        <button
            class="page-button"
            id="nextButton"
            onclick="nextPage()"
        >
            Next →
        </button>

    </div>

</div>


<!-- =========================
     CONFIRMATION MODAL
========================== -->
