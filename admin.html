<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Crypto Faucet</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .withdrawal {
            border: 1px solid #ddd;
            padding: 18px;
            margin: 12px 0;
            border-radius: 10px;
            background: #fafafa;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: #d97706;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 4px;
            color: white;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .approve {
            background: #16a34a;
        }

        .reject {
            background: #dc2626;
        }

        .refresh {
            background: #2563eb;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
        }

        .empty {
            padding: 20px;
            text-align: center;
            color: #666;
        }

    </style>

</head>

<body>

<header>

    <h1>🔐 Admin Dashboard</h1>

</header>


<div class="container">

    <h2>💸 Pending BTC Withdrawals</h2>

    <button
        class="refresh"
        onclick="loadWithdrawals()"
    >
        🔄 REFRESH
    </button>

    <div id="message">
        ⏳ Loading...
    </div>

    <div id="withdrawals"></div>

</div>


<script>


let processing = false;


/* =========================
   PROCESS WITHDRAWAL
========================= */

async function processWithdrawal(id, action) {

    if (processing) {
        return;
    }

    const confirmation =
        confirm(
            `Are you sure you want to ${action} withdrawal #${id}?`
        );

    if (!confirmation) {
        return;
    }

    processing = true;

    const message =
        document.getElementById("message");

    message.innerText =
        "⏳ Processing withdrawal...";


    try {

        const response =
            await fetch(
                "/api/admin/withdrawal-action",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        withdrawalId: id,

                        action: action

                    })
                }
            );


        const result =
            await response.json();


        if (result.success) {

            if (result.status === "approved") {

                message.innerText =
                    "✅ Withdrawal approved successfully.";

            } else if (
                result.status === "rejected"
            ) {

                message.innerText =
                    "✅ Withdrawal rejected. BTC refunded to user.";

            } else {

                message.innerText =
                    "✅ Withdrawal processed.";

            }

            /*
             * Reload pending withdrawals.
             */
            await loadWithdrawals();

        } else {

            message.innerText =
                "❌ " + (
                    result.error ||
                    "Unable to process withdrawal."
                );
        }


    } catch (error) {

        console.error(error);

        message.innerText =
            "❌ Connection error.";

    } finally {

        processing = false;
    }
}


/* =========================
   LOAD PENDING WITHDRAWALS
========================= */

async function loadWithdrawals() {

    const message =
        document.getElementById("message");

    const container =
        document.getElementById("withdrawals");


    message.innerText =
        "⏳ Loading pending withdrawals...";


    try {

        const response =
            await fetch(
                "/api/admin/withdrawals"
            );


        const result =
            await response.json();


        if (!result.success) {

            message.innerText =
                "❌ " + (
                    result.error ||
                    "Unable to load withdrawals."
                );

            container.innerHTML = "";

            return;
        }


        const withdrawals =
            result.withdrawals || [];


        message.innerText =
            `${withdrawals.length} pending BTC withdrawal(s)`;


        if (withdrawals.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    ✅ No pending BTC withdrawals.
                </div>
            `;

            return;
        }


        container.innerHTML =
            withdrawals
                .map(item => `

                    <div class="withdrawal">

                        <strong>
                            Withdrawal #${item.id}
                        </strong>

                        <br><br>

                        👤 User ID:
                        ${item.user_id}

                        <br>

                        📧 Email:
                        ${item.email || "N/A"}

                        <br>

                        💰 Amount:
                        ${item.amount} BTC

                        <br>

                        🏦 Wallet:
                        ${item.wallet_address}

                        <br>

                        📌 Status:

                        <span class="status pending">
                            ${String(
                                item.status
                            ).toUpperCase()}
                        </span>

                        <br>

                        🕐 Date:
                        ${new Date(
                            item.created_at
                        ).toLocaleString()}

                        <br><br>


                        <button
                            class="approve"
                            onclick="
                                processWithdrawal(
                                    ${item.id},
                                    'approve'
                                )
                            "
                        >
                            ✅ APPROVE
                        </button>


                        <button
                            class="reject"
                            onclick="
                                processWithdrawal(
                                    ${item.id},
                                    'reject'
                                )
                            "
                        >
                            ❌ REJECT
                        </button>

                    </div>

                `)
                .join("");


    } catch (error) {

        console.error(error);

        message.innerText =
            "❌ Unable to load withdrawals.";

        container.innerHTML = "";
    }
}


/* =========================
   INITIAL LOAD
========================= */

loadWithdrawals();


</script>

</body>

</html>
